\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">air in a syringe</text><rect x=\"24\" y=\"27\" width=\"16\" height=\"4\" rx=\"1.5\" fill=\"#444441\" stroke=\"#444441\" stroke-width=\"1.2\"/></svg>"}, {"id": "P4·3-7", "lv": 2, "q": "The water level rises from 50 ml to 70 ml. What is the volume of the stone?", "qz": "水位从 50 ml 升到 70 ml。石头的体积是多少?", "a": "20 cm³.", "az": "20 立方厘米。", "s": "Volume of the stone = 70 cm³ − 50 cm³ = 20 cm³.", "f": "70 − 50 = 20。单位是 cm³,不是 cm。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"48.6\" y=\"26\" width=\"20.8\" height=\"20\" fill=\"#CFE6F8\"/><path d=\"M48 6 V46 H70 V6\" fill=\"none\" stroke=\"#444441\" stroke-width=\"1.3\"/><text x=\"59\" y=\"54\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">50 ml</text><line x1=\"48\" y1=\"41\" x2=\"52\" y2=\"41\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"48\" y1=\"36\" x2=\"52\" y2=\"36\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"48\" y1=\"31\" x2=\"52\" y2=\"31\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"48\" y1=\"26\" x2=\"52\" y2=\"26\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"48\" y1=\"21\" x2=\"52\" y2=\"21\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"48\" y1=\"16\" x2=\"52\" y2=\"16\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"48\" y1=\"11\" x2=\"52\" y2=\"11\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"78\" y1=\"28\" x2=\"96\" y2=\"28\" stroke=\"#888780\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"/><rect x=\"104.6\" y=\"18\" width=\"20.8\" height=\"28\" fill=\"#CFE6F8\"/><path d=\"M104 6 V46 H126 V6\" fill=\"none\" stroke=\"#444441\" stroke-width=\"1.3\"/><ellipse cx=\"115\" cy=\"41\" rx=\"6\" ry=\"4\" fill=\"#888780\"/><text x=\"115\" y=\"54\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">70 ml</text><line x1=\"104\" y1=\"41\" x2=\"108\" y2=\"41\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"104\" y1=\"36\" x2=\"108\" y2=\"36\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"104\" y1=\"31\" x2=\"108\" y2=\"31\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"104\" y1=\"26\" x2=\"108\" y2=\"26\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"104\" y1=\"21\" x2=\"108\" y2=\"21\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"104\" y1=\"16\" x2=\"108\" y2=\"16\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"104\" y1=\"11\" x2=\"108\" y2=\"11\" stroke=\"#444441\" stroke-width=\"0.6\"/><text x=\"146\" y=\"30\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\">stone in</text></svg>"}, {"id": "P4·3-8", "lv": 3, "q": "You pump more air into a ball. Does its mass change?", "qz": "给球再打一些气。它的质量会变吗?", "a": "Yes. It gets heavier because air has mass.", "az": "会。它变重了,因为空气有质量。", "s": "Air has mass, so the mass of the ball increases.", "f": "空气也有体重,只是很轻。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"50\" y=\"40\" text-anchor=\"middle\" font-size=\"26\" font-family=\"Noto Color Emoji\">⚽</text><text x=\"50\" y=\"54\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">before</text><text x=\"86\" y=\"30\" text-anchor=\"middle\" font-size=\"7\" font-weight=\"700\" fill=\"#378ADD\">+ air</text><line x1=\"74\" y1=\"34\" x2=\"98\" y2=\"34\" stroke=\"#378ADD\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"/><text x=\"122\" y=\"40\" text-anchor=\"middle\" font-size=\"30\" font-family=\"Noto Color Emoji\">⚽</text><text x=\"122\" y=\"54\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">after: heavier?</text></svg>"}, {"id": "P4·3-9", "lv": 1, "q": "What is mass? What is volume?", "qz": "什么是质量?什么是体积?", "a": "Amount of matter. Amount of space.", "az": "物质有多少。占多少空间。", "s": "Mass is the amount of matter. Volume is the amount of space occupied.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">⚖️</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">mass</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">📦</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">volume</text></svg>"}, {"id": "P4·3-10", "lv": 1, "q": "What do we use to measure mass? In what units?", "qz": "用什么量质量?单位是什么?", "a": "An electronic balance. g or kg.", "az": "电子秤。克或千克。", "s": "Mass is measured with an electronic balance in grams or kilograms.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">⚖️</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">?</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🍎</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">apple</text></svg>"}, {"id": "P4·3-11", "lv": 2, "q": "The balance shows 3 g with nothing on it. What should you do?", "qz": "秤上没东西,却显示 3 g。该怎么办?", "a": "Press the Tare (Zero) button.", "az": "按 Tare(归零)键。", "s": "Press the 'Tare' button so that the reading is zero before measuring.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"56\" y=\"30\" width=\"60\" height=\"14\" rx=\"1.5\" fill=\"#DDD\" stroke=\"#444441\" stroke-width=\"1.2\"/><rect x=\"60\" y=\"23\" width=\"52\" height=\"6\" rx=\"1.5\" fill=\"#BBB\" stroke=\"#444441\" stroke-width=\"1.2\"/><rect x=\"72\" y=\"33\" width=\"28\" height=\"8\" rx=\"1.5\" fill=\"#fff\" stroke=\"#444441\" stroke-width=\"0.8\"/><text x=\"86\" y=\"39.5\" text-anchor=\"middle\" font-size=\"6\" font-weight=\"700\" fill=\"#444441\">3.0 g</text><text x=\"86\" y=\"54\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">nothing on the pan</text></svg>"}, {"id": "P4·3-12", "lv": 2, "q": "Empty beaker: 64 g. Beaker with water: 138 g. What is the mass of the water?", "qz": "空烧杯 64 g,装水后 138 g。水的质量是多少?", "a": "74 g.", "az": "74 克。", "s": "Mass of water = 138 g − 64 g = 74 g.", "f": "烧杯的体重不能算给水。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><path d=\"M36 14 V42 H62 V14\" fill=\"none\" stroke=\"#444441\" stroke-width=\"1.3\"/><text x=\"49\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">64 g</text><rect x=\"110.6\" y=\"24\" width=\"24.8\" height=\"18\" fill=\"#CFE6F8\"/><path d=\"M110 14 V42 H136 V14\" fill=\"none\" stroke=\"#444441\" stroke-width=\"1.3\"/><text x=\"123\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">138 g</text></svg>"}, {"id": "P4·3-13", "lv": 2, "q": "Which measures volume more accurately: a beaker or a measuring cylinder?", "qz": "烧杯和量筒,哪个量体积更准?", "a": "A measuring cylinder.", "az": "量筒。", "s": "A measuring cylinder measures volume more accurately than a beaker.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"40.6\" y=\"32\" width=\"32.8\" height=\"14\" fill=\"#CFE6F8\"/><path d=\"M40 20 V46 H74 V20\" fill=\"none\" stroke=\"#444441\" stroke-width=\"1.3\"/><text x=\"57\" y=\"54\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">beaker</text><rect x=\"110.6\" y=\"26\" width=\"20.8\" height=\"20\" fill=\"#CFE6F8\"/><path d=\"M110 6 V46 H132 V6\" fill=\"none\" stroke=\"#444441\" stroke-width=\"1.3\"/><text x=\"121\" y=\"54\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">measuring cylinder</text><line x1=\"110\" y1=\"41\" x2=\"114\" y2=\"41\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"110\" y1=\"36\" x2=\"114\" y2=\"36\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"110\" y1=\"31\" x2=\"114\" y2=\"31\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"110\" y1=\"26\" x2=\"114\" y2=\"26\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"110\" y1=\"21\" x2=\"114\" y2=\"21\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"110\" y1=\"16\" x2=\"114\" y2=\"16\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"110\" y1=\"11\" x2=\"114\" y2=\"11\" stroke=\"#444441\" stroke-width=\"0.6\"/></svg>"}, {"id": "P4·3-14", "lv": 2, "q": "Where should your eye be when you read a measuring cylinder?", "qz": "读量筒时,眼睛要放在哪里?", "a": "Level with the bottom of the curved surface.", "az": "和弯曲液面的最低点一样高。", "s": "Take the reading from the bottom of the curved surface at eye level.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"60.6\" y=\"24\" width=\"20.8\" height=\"22\" fill=\"#CFE6F8\"/><path d=\"M60 6 V46 H82 V6\" fill=\"none\" stroke=\"#444441\" stroke-width=\"1.3\"/><text x=\"71\" y=\"54\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\"></text><line x1=\"60\" y1=\"41\" x2=\"64\" y2=\"41\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"60\" y1=\"36\" x2=\"64\" y2=\"36\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"60\" y1=\"31\" x2=\"64\" y2=\"31\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"60\" y1=\"26\" x2=\"64\" y2=\"26\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"60\" y1=\"21\" x2=\"64\" y2=\"21\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"60\" y1=\"16\" x2=\"64\" y2=\"16\" stroke=\"#444441\" stroke-width=\"0.6\"/><line x1=\"60\" y1=\"11\" x2=\"64\" y2=\"11\" stroke=\"#444441\" stroke-width=\"0.6\"/><text x=\"124\" y=\"31\" text-anchor=\"middle\" font-size=\"16\" font-family=\"Noto Color Emoji\">👁️</text><line x1=\"84\" y1=\"24\" x2=\"112\" y2=\"26\" stroke=\"#888780\" stroke-width=\"0.8\" stroke-dasharray=\"2 2\"/><text x=\"124\" y=\"44\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\">eye level?</text></svg>"}, {"id": "P4·3-15", "lv": 1, "q": "1 cm³ is the same as how many ml?", "qz": "1 cm³ 等于多少 ml?", "a": "1 ml.", "az": "1 毫升。", "s": "1 cm³ = 1 ml.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"86\" y=\"36\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#444441\">1 cm³ = ? ml</text></svg>"}, {"id": "P4·3-16", "lv": 3, "q": "A ball of plasticine is rolled into a log. Does its mass change?", "qz": "把一团橡皮泥搓成长条。质量会变吗?", "a": "No.", "az": "不会。", "s": "The shape does not affect the mass because the amount of matter is the same.", "f": "捏扁了也不会变轻,减肥没这么容易。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><circle cx=\"50\" cy=\"28\" r=\"12\" fill=\"#E58C8A\" stroke=\"#444441\" stroke-width=\"1\"/><line x1=\"70\" y1=\"28\" x2=\"92\" y2=\"28\" stroke=\"#888780\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"/><rect x=\"100\" y=\"22\" width=\"50\" height=\"12\" rx=\"6\" fill=\"#E58C8A\" stroke=\"#444441\" stroke-width=\"1.2\"/><text x=\"50\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">ball</text><text x=\"125\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">log</text></svg>"}]}, {"code": "P4·4", "en": "LIGHT", "zh": "光", "color": "#C99A06", "cards": [{"id": "P4·4-1", "lv": 1, "q": "Is the Moon a source of light?", "qz": "月亮是光源吗?", "a": "No. It reflects light from the Sun.", "az": "不是。它反射太阳的光。", "s": "The Moon is not a source of light. It reflects light from the Sun.", "f": "月亮是借光的,借了几十亿年还没还。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"86\" y=\"38\" text-anchor=\"middle\" font-size=\"30\" font-family=\"Noto Color Emoji\">🌙</text><text x=\"86\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">the Moon at night</text></svg>"}, {"id": "P4·4-2", "lv": 1, "q": "Which of these is NOT a light source?", "qz": "这几个里面哪个不是光源?", "a": "The Moon. It does not give off its own light.", "az": "月亮。它自己不会发光。", "s": "A source of light gives off its own light.", "f": "自己会发光的才叫光源。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"21.5\" y=\"32\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Noto Color Emoji\">☀️</text><text x=\"21.5\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">Sun</text><text x=\"64.5\" y=\"32\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Noto Color Emoji\">💡</text><text x=\"64.5\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">lit bulb</text><text x=\"107.5\" y=\"32\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Noto Color Emoji\">🔥</text><text x=\"107.5\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">fire</text><text x=\"150.5\" y=\"32\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Noto Color Emoji\">🌙</text><text x=\"150.5\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">Moon ?</text></svg>"}, {"id": "P4·4-3", "lv": 2, "q": "How do we see a book?", "qz": "我们怎样看见一本书?", "a": "Light from the lamp is reflected by the book into our eyes.", "az": "灯的光照到书上,被书反射进我们的眼睛。", "s": "Light from the lamp is reflected from the book into our eyes.", "f": "三步:光源 → 物体 → 眼睛。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"26\" y=\"34\" text-anchor=\"middle\" font-size=\"22\" font-family=\"Noto Color Emoji\">💡</text><text x=\"86\" y=\"40\" text-anchor=\"middle\" font-size=\"22\" font-family=\"Noto Color Emoji\">📖</text><text x=\"148\" y=\"34\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Noto Color Emoji\">👁️</text><text x=\"26\" y=\"48\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">lamp</text><text x=\"86\" y=\"54\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">book</text><text x=\"148\" y=\"48\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">eye</text></svg>"}, {"id": "P4·4-4", "lv": 2, "q": "Arrow A or arrow B: which shows how light travels?", "qz": "箭头 A 还是 B,哪个是光的方向?", "a": "A. Light goes from the book to the eye.", "az": "A。光是从书进入眼睛的。", "s": "The reflected light from the book enters our eyes.", "f": "眼睛不会发射激光,你不是超人。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"40\" y=\"38\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">📖</text><text x=\"132\" y=\"36\" text-anchor=\"middle\" font-size=\"22\" font-family=\"Noto Color Emoji\">👁️</text><line x1=\"58\" y1=\"22\" x2=\"114\" y2=\"22\" stroke=\"#F5C542\" stroke-width=\"2\"/><text x=\"86\" y=\"16\" text-anchor=\"middle\" font-size=\"7\" font-weight=\"700\" fill=\"#D85A30\">A  →</text><line x1=\"58\" y1=\"34\" x2=\"114\" y2=\"34\" stroke=\"#F5C542\" stroke-width=\"2\"/><text x=\"86\" y=\"46\" text-anchor=\"middle\" font-size=\"7\" font-weight=\"700\" fill=\"#378ADD\">←  B</text><text x=\"86\" y=\"57\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\">Which arrow shows the light?</text></svg>"}, {"id": "P4·4-5", "lv": 1, "q": "Can you see in a completely dark room?", "qz": "在完全黑暗的房间里能看见东西吗?", "a": "No. No light enters your eyes.", "az": "不能。没有光进入眼睛。", "s": "We cannot see because no light enters our eyes.", "f": "瞪得再大也没用。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"30\" y=\"4\" width=\"112\" height=\"42\" rx=\"1.5\" fill=\"#2B2B2A\" stroke=\"#444441\" stroke-width=\"1.2\"/><text x=\"86\" y=\"34\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Noto Color Emoji\">👀</text><text x=\"86\" y=\"55\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">no lamp, no window, no light</text></svg>"}, {"id": "P4·4-6", "lv": 2, "q": "You can see the flame only when the 3 holes line up. What does this show?", "qz": "三个孔排成一直线才看得到烛光。这说明什么?", "a": "Light travels in straight lines.", "az": "光沿直线传播。", "s": "This shows that light travels in straight lines.", "f": "光不会拐弯。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"18\" y=\"36\" text-anchor=\"middle\" font-size=\"22\" font-family=\"Noto Color Emoji\">🕯️</text><rect x=\"54\" y=\"10\" width=\"4\" height=\"32\" rx=\"0\" fill=\"#E8C48A\" stroke=\"#8A5A2B\" stroke-width=\"0.8\"/><circle cx=\"56\" cy=\"26\" r=\"1.6\" fill=\"#fff\" stroke=\"#8A5A2B\" stroke-width=\"0.5\"/><rect x=\"88\" y=\"10\" width=\"4\" height=\"32\" rx=\"0\" fill=\"#E8C48A\" stroke=\"#8A5A2B\" stroke-width=\"0.8\"/><circle cx=\"90\" cy=\"26\" r=\"1.6\" fill=\"#fff\" stroke=\"#8A5A2B\" stroke-width=\"0.5\"/><rect x=\"122\" y=\"10\" width=\"4\" height=\"32\" rx=\"0\" fill=\"#E8C48A\" stroke=\"#8A5A2B\" stroke-width=\"0.8\"/><circle cx=\"124\" cy=\"26\" r=\"1.6\" fill=\"#fff\" stroke=\"#8A5A2B\" stroke-width=\"0.5\"/><line x1=\"28\" y1=\"26\" x2=\"150\" y2=\"26\" stroke=\"#F5C542\" stroke-width=\"1.6\"/><text x=\"160\" y=\"32\" text-anchor=\"middle\" font-size=\"14\" font-family=\"Noto Color Emoji\">👁️</text><text x=\"90\" y=\"54\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">three holes in one straight line</text></svg>"}, {"id": "P4·4-7", "lv": 2, "q": "Is a mirror a source of light?", "qz": "镜子是光源吗?", "a": "No. It only reflects light.", "az": "不是。它只反射光。", "s": "A mirror does not give off its own light. It reflects light.", "f": "关了灯,镜子也是黑的。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"70\" y=\"6\" width=\"32\" height=\"40\" rx=\"1.5\" fill=\"#DDEFF7\" stroke=\"#888780\" stroke-width=\"2.5\"/><line x1=\"78\" y1=\"14\" x2=\"88\" y2=\"30\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"86\" y=\"55\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">a mirror</text></svg>"}, {"id": "P4·4-8", "lv": 2, "q": "Why is a light experiment done in a dark room?", "qz": "光的实验为什么要在暗室里做?", "a": "So that the only light comes from the torch.", "az": "确保光只来自手电筒。", "s": "This ensures that the only source of light is the torch.", "f": "不是因为“看得比较清楚”。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"20\" y=\"4\" width=\"132\" height=\"44\" rx=\"1.5\" fill=\"#2B2B2A\" stroke=\"#444441\" stroke-width=\"1.2\"/><text x=\"44\" y=\"36\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Noto Color Emoji\">🔦</text><path d=\"M58 26 L120 14 L120 38 Z\" fill=\"#F9E79F\" stroke=\"none\" stroke-width=\"0\"/><rect x=\"120\" y=\"10\" width=\"4\" height=\"32\" rx=\"1.5\" fill=\"#fff\" stroke=\"#fff\" stroke-width=\"1.2\"/><text x=\"86\" y=\"56\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">experiment in a dark room</text></svg>"}, {"id": "P4·4-9", "lv": 1, "q": "What is a source of light?", "qz": "什么是光源?", "a": "An object that gives off light.", "az": "自己会发光的物体。", "s": "A source of light is an object that gives off its own light.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🔦</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">torch</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">⭐</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">star</text></svg>"}, {"id": "P4·4-10", "lv": 1, "q": "Name two natural sources of light.", "qz": "说出两个天然光源。", "a": "The Sun and stars.", "az": "太阳和星星。", "s": "The Sun and stars are natural sources of light.", "f": "闪电和萤火虫也算。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌞</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">?</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">✨</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">?</text></svg>"}, {"id": "P4·4-11", "lv": 1, "q": "Name two man-made sources of light.", "qz": "说出两个人造光源。", "a": "Light bulbs and fireworks.", "az": "灯泡和烟花。", "s": "Light bulbs and fireworks are man-made sources of light.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">💡</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">?</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🎆</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">?</text></svg>"}, {"id": "P4·4-12", "lv": 2, "q": "What is the main source of light on Earth?", "qz": "地球上主要的光源是什么?", "a": "The Sun.", "az": "太阳。", "s": "The Sun is the main source of light on the Earth.", "f": "太阳其实是一颗恒星(star)。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌍</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">Earth</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">❓</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">main source</text></svg>"}, {"id": "P4·4-13", "lv": 2, "q": "How do we see a candle flame?", "qz": "我们怎样看见烛火?", "a": "Its light enters our eyes directly.", "az": "它的光直接进入眼睛。", "s": "Light from the flame enters our eyes directly.", "f": "光源:直接进眼睛。不是光源:反射进眼睛。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🕯️</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">flame</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">👁️</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">eye</text></svg>"}, {"id": "P4·4-14", "lv": 2, "q": "Name a living thing that gives off its own light.", "qz": "说出一种自己会发光的生物。", "a": "A firefly.", "az": "萤火虫。", "s": "Some living things, such as fireflies, give off their own light.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌃</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">at night</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">❓</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">who glows?</text></svg>"}, {"id": "P4·4-15", "lv": 2, "q": "It is sunny, but you wear a blindfold. Why can't you see?", "qz": "太阳很大,但你蒙着眼睛。为什么看不见?", "a": "No light enters your eyes.", "az": "没有光进入眼睛。", "s": "For us to see, light must enter our eyes.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">☀️</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">Sun</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🙈</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">blindfold</text></svg>"}, {"id": "P4·4-16", "lv": 3, "q": "The Moon is not a source of light. How can we see it?", "qz": "月亮不是光源。我们怎么能看见它?", "a": "It reflects sunlight into our eyes.", "az": "它把太阳光反射进眼睛。", "s": "Light from the Sun falls onto the Moon and is reflected into our eyes.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"86\" y=\"38\" text-anchor=\"middle\" font-size=\"30\" font-family=\"Noto Color Emoji\">🌙</text><text x=\"86\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">the Moon at night</text></svg>"}]}, {"code": "P4·5", "en": "SHADOWS", "zh": "影子", "color": "#555E6B", "cards": [{"id": "P4·5-1", "lv": 1, "q": "How is a shadow formed?", "qz": "影子是怎样形成的?", "a": "An opaque object blocks the light.", "az": "不透明物体挡住了光。", "s": "Light travels in straight lines and cannot pass through the opaque object.", "f": "光沿直线传播(travels in straight lines),绕不过去。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"22\" y=\"32\" text-anchor=\"middle\" font-size=\"16\" font-family=\"Noto Color Emoji\">🔦</text><line x1=\"140\" y1=\"2\" x2=\"140\" y2=\"50\" stroke=\"#BBBBBB\" stroke-width=\"2.5\"/><line x1=\"30\" y1=\"26\" x2=\"140\" y2=\"8.399999999999999\" stroke=\"#F5C542\" stroke-width=\"1\"/><line x1=\"30\" y1=\"26\" x2=\"140\" y2=\"43.6\" stroke=\"#F5C542\" stroke-width=\"1\"/><rect x=\"78.5\" y=\"18\" width=\"3\" height=\"16\" rx=\"0\" fill=\"#444441\" stroke=\"#444441\" stroke-width=\"0.6\"/><rect x=\"138\" y=\"8.399999999999999\" width=\"4\" height=\"35.2\" rx=\"0\" fill=\"#222\" stroke=\"none\" stroke-width=\"0\"/><text x=\"145\" y=\"28\" text-anchor=\"start\" font-size=\"5\" font-weight=\"700\" fill=\"#444441\">shadow</text><text x=\"80\" y=\"42\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">object</text><text x=\"138\" y=\"57\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">screen</text><text x=\"24\" y=\"46\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">torch</text></svg>"}, {"id": "P4·5-2", "lv": 2, "q": "The object moves closer to the torch. What happens to the shadow?", "qz": "物体移近手电筒,影子会怎样?", "a": "The shadow becomes bigger.", "az": "影子变大。", "s": "As the object is placed closer to the source of light, the size of the shadow increases.", "f": "靠近光源 → 变大。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" ref \" font-family=\"Noto Color Emoji\">🔦</text><line x1=\"140\" y1=\"2\" x2=\"140\" y2=\"50\" stroke=\"#BBBBBB\" stroke-width=\"2.5\"/><line x1=\"30\" y1=\"26\" x2=\"140\" y2=\"8.399999999999999\" stroke=\"#F5C542\" stroke-width=\"1\"/><line x1=\"30\" y1=\"26\" x2=\"140\" y2=\"43.6\" stroke=\"#F5C542\" stroke-width=\"1\"/><rect x=\"78.5\" y=\"18\" width=\"3\" height=\"16\" rx=\"0\" fill=\"#444441\" stroke=\"#444441\" stroke-width=\"0.6\"/><rect x=\"138\" y=\"8.399999999999999\" width=\"4\" height=\"35.2\" rx=\"0\" fill=\"#222\" stroke=\"none\" stroke-width=\"0\"/><text x=\"145\" y=\"28\" text-anchor=\"start\" font-size=\"5\" font-weight=\"700\" fill=\"#444441\">shadow</text><text x=\"80\" y=\"42\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">object</text><text x=\"138\" y=\"57\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">screen</text><text x=\"24\" y=\"46\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">torch</text><line x1=\"80\" y1=\"14\" x2=\"110\" y2=\"14\" stroke=\"#D85A30\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/></svg>"}, {"id": "P4·5-4", "lv": 1, "q": "Does clear glass make a dark shadow?", "qz": "透明玻璃会有很黑的影子吗?", "a": "No. Most light passes through it.", "az": "不会。大部分光都穿过去了。", "s": "A transparent object allows most light to pass through it.", "f": "透明 transparent:光直接通过。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"22\" y=\"34\" text-anchor=\"middle\" font-size=\"18\" font-family=\"Noto Color Emoji\">🔦</text><path d=\"M34 26 L150 10 L150 42 Z\" fill=\"#FBF1C4\" stroke=\"none\" stroke-width=\"0\"/><rect x=\"84\" y=\"12\" width=\"4\" height=\"28\" rx=\"0\" fill=\"#CFE6F8\" stroke=\"#378ADD\" stroke-width=\"0.8\"/><line x1=\"150\" y1=\"2\" x2=\"150\" y2=\"50\" stroke=\"#444441\" stroke-width=\"2.5\"/><text x=\"86\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">clear glass</text><text x=\"150\" y=\"57\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">screen</text></svg>"}, {"id": "P4·5-5", "lv": 2, "q": "What kind of shadow does frosted glass make?", "qz": "磨砂玻璃的影子是怎样的?", "a": "A less dark shadow.", "az": "比较淡的影子。", "s": "A translucent object allows only some light to pass through, so the shadow is less dark.", "f": "磨砂玻璃是半透明 translucent。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"22\" y=\"34\" text-anchor=\"middle\" font-size=\"18\" font-family=\"Noto Color Emoji\">🔦</text><path d=\"M34 26 L86 19 L86 33 Z\" fill=\"#FBF1C4\" stroke=\"none\" stroke-width=\"0\"/><path d=\"M88 19 L150 10 L150 42 L88 33 Z\" fill=\"#FDF8E3\" stroke=\"none\" stroke-width=\"0\"/><rect x=\"84\" y=\"12\" width=\"4\" height=\"28\" rx=\"0\" fill=\"#C9C9C9\" stroke=\"#888780\" stroke-width=\"0.8\"/><line x1=\"150\" y1=\"2\" x2=\"150\" y2=\"50\" stroke=\"#444441\" stroke-width=\"2.5\"/><text x=\"86\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">frosted glass</text><text x=\"150\" y=\"57\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">screen</text></svg>"}, {"id": "P4·5-6", "lv": 2, "q": "When is your shadow the shortest?", "qz": "一天里什么时候影子最短?", "a": "At noon. The Sun is highest.", "az": "中午。太阳最高。", "s": "At noon, the Sun is directly above us, so our shadows are the shortest.", "f": "中午找树荫最难。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><line x1=\"10\" y1=\"48\" x2=\"162\" y2=\"48\" stroke=\"#8A5A2B\" stroke-width=\"1.2\"/><path d=\"M20 48 Q86 -28 152 48\" fill=\"none\" stroke=\"#F5C542\" stroke-width=\"1\"/><text x=\"28\" y=\"40\" text-anchor=\"middle\" font-size=\"13\" font-family=\"Noto Color Emoji\">☀️</text><text x=\"86\" y=\"14\" text-anchor=\"middle\" font-size=\"13\" font-family=\"Noto Color Emoji\">☀️</text><text x=\"144\" y=\"40\" text-anchor=\"middle\" font-size=\"13\" font-family=\"Noto Color Emoji\">☀️</text><text x=\"28\" y=\"56\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">morning</text><text x=\"86\" y=\"28\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">noon</text><text x=\"144\" y=\"56\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">evening</text><line x1=\"86\" y1=\"48\" x2=\"86\" y2=\"36\" stroke=\"#444441\" stroke-width=\"3\"/><circle cx=\"86\" cy=\"34\" r=\"3\" fill=\"#444441\" stroke=\"none\" stroke-width=\"1\"/></svg>"}, {"id": "P4·5-7", "lv": 2, "q": "Is your shadow long or short in the early morning?", "qz": "清晨的影子是长还是短?", "a": "Long. The Sun is low.", "az": "长。太阳很低。", "s": "In the early morning, the Sun is at its lowest position, so shadows are long.", "f": "早上和傍晚,你都是“长腿巨人”。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><line x1=\"10\" y1=\"46\" x2=\"162\" y2=\"46\" stroke=\"#8A5A2B\" stroke-width=\"1.2\"/><line x1=\"86\" y1=\"46\" x2=\"86\" y2=\"22\" stroke=\"#444441\" stroke-width=\"3\"/><circle cx=\"86\" cy=\"18\" r=\"4\" fill=\"#444441\" stroke=\"none\" stroke-width=\"1\"/><text x=\"22\" y=\"34\" text-anchor=\"middle\" font-size=\"16\" font-family=\"Noto Color Emoji\">☀️</text><text x=\"120\" y=\"40\" text-anchor=\"middle\" font-size=\"6\" font-weight=\"700\" fill=\"#888780\">shadow?</text><text x=\"86\" y=\"57\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\">8 am: the Sun is low</text></svg>"}, {"id": "P4·5-8", "lv": 3, "q": "The tip of a cone faces the torch. What shape is its shadow?", "qz": "圆锥的尖端对着手电筒。影子是什么形状?", "a": "A circle.", "az": "圆形。", "s": "The circular surface of the cone blocks the light, so the shadow is circular.", "f": "挡住光的是后面那个圆圆的底。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"20\" y=\"34\" text-anchor=\"middle\" font-size=\"18\" font-family=\"Noto Color Emoji\">🔦</text><path d=\"M70 26 L100 12 L100 40 Z\" fill=\"#E8C48A\" stroke=\"#8A5A2B\" stroke-width=\"1.3\"/><line x1=\"150\" y1=\"2\" x2=\"150\" y2=\"50\" stroke=\"#444441\" stroke-width=\"2.5\"/><text x=\"138\" y=\"30\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#D85A30\">?</text><text x=\"84\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">cone: tip faces the torch</text></svg>"}, {"id": "P4·5-9", "lv": 1, "q": "What is a shadow?", "qz": "什么是影子?", "a": "A dark area where light is blocked.", "az": "光被挡住形成的暗区。", "s": "A shadow is a dark area formed when an opaque object blocks light.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"22\" y=\"32\" text-anchor=\"middle\" font-size=\"16\" font-family=\"Noto Color Emoji\">🔦</text><line x1=\"140\" y1=\"2\" x2=\"140\" y2=\"50\" stroke=\"#BBBBBB\" stroke-width=\"2.5\"/><line x1=\"30\" y1=\"26\" x2=\"140\" y2=\"8.399999999999999\" stroke=\"#F5C542\" stroke-width=\"1\"/><line x1=\"30\" y1=\"26\" x2=\"140\" y2=\"43.6\" stroke=\"#F5C542\" stroke-width=\"1\"/><rect x=\"78.5\" y=\"18\" width=\"3\" height=\"16\" rx=\"0\" fill=\"#444441\" stroke=\"#444441\" stroke-width=\"0.6\"/><rect x=\"138\" y=\"8.399999999999999\" width=\"4\" height=\"35.2\" rx=\"0\" fill=\"#222\" stroke=\"none\" stroke-width=\"0\"/><text x=\"145\" y=\"28\" text-anchor=\"start\" font-size=\"5\" font-weight=\"700\" fill=\"#444441\">shadow</text><text x=\"80\" y=\"42\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">object</text><text x=\"138\" y=\"57\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">screen</text><text x=\"24\" y=\"46\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">torch</text></svg>"}, {"id": "P4·5-10", "lv": 1, "q": "Which kind of object lets no light pass through?", "qz": "哪一种物体完全不让光通过?", "a": "An opaque object.", "az": "不透明物体。", "s": "An opaque object does not allow any light to pass through it.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"86\" y=\"30\" text-anchor=\"middle\" font-size=\"14\" font-family=\"Noto Color Emoji\">⭐</text><rect x=\"23\" y=\"8\" width=\"26\" height=\"26\" fill=\"#fff\" fill-opacity=\"0.05\" stroke=\"#444441\"/><text x=\"36\" y=\"44\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">A</text><rect x=\"73\" y=\"8\" width=\"26\" height=\"26\" fill=\"#C9C9C9\" fill-opacity=\"0.75\" stroke=\"#444441\"/><text x=\"86\" y=\"44\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">B</text><rect x=\"123\" y=\"8\" width=\"26\" height=\"26\" fill=\"#444\" fill-opacity=\"1\" stroke=\"#444441\"/><text x=\"136\" y=\"44\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">C</text><text x=\"36\" y=\"27\" text-anchor=\"middle\" font-size=\"14\" font-family=\"Noto Color Emoji\">⭐</text><text x=\"86\" y=\"55\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\">How well can you see the star behind?</text></svg>"}, {"id": "P4·5-11", "lv": 2, "q": "What do we call the surface on which a shadow is formed?", "qz": "影子落在上面的那个面叫什么?", "a": "The screen.", "az": "屏幕。", "s": "The surface on which a shadow is formed is called the screen.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"28.666666666666668\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🔦</text><text x=\"28.666666666666668\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">torch</text><text x=\"86.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">⚽</text><text x=\"86.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">ball</text><text x=\"143.33333333333334\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">❓</text><text x=\"143.33333333333334\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">surface</text></svg>"}, {"id": "P4·5-12", "lv": 2, "q": "The torch is moved further away from the object. What happens to the shadow?", "qz": "手电筒离物体更远了。影子会怎样?", "a": "It becomes smaller.", "az": "变小。", "s": "As the source of light is placed further away from the object, the size of the shadow decreases.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🔦</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">← moves away</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">⚽</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">ball</text></svg>"}, {"id": "P4·5-13", "lv": 2, "q": "The screen is moved further away from the object. What happens to the shadow?", "qz": "屏幕离物体更远了。影子会怎样?", "a": "It becomes bigger.", "az": "变大。", "s": "As the screen is placed further away from the object, the size of the shadow increases.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">⚽</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">ball</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">⬜</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">screen moves away →</text></svg>"}, {"id": "P4·5-14", "lv": 2, "q": "How can you predict the size of a shadow on paper?", "qz": "怎样在纸上预测影子的大小?", "a": "Draw straight light rays.", "az": "画直直的光线。", "s": "Draw light rays from the source of light past the top and bottom of the object.", "f": "要用尺画,光不会走弯路。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"22\" y=\"32\" text-anchor=\"middle\" font-size=\"16\" font-family=\"Noto Color Emoji\">🔦</text><line x1=\"140\" y1=\"2\" x2=\"140\" y2=\"50\" stroke=\"#BBBBBB\" stroke-width=\"2.5\"/><line x1=\"30\" y1=\"26\" x2=\"140\" y2=\"8.399999999999999\" stroke=\"#F5C542\" stroke-width=\"1\"/><line x1=\"30\" y1=\"26\" x2=\"140\" y2=\"43.6\" stroke=\"#F5C542\" stroke-width=\"1\"/><rect x=\"78.5\" y=\"18\" width=\"3\" height=\"16\" rx=\"0\" fill=\"#444441\" stroke=\"#444441\" stroke-width=\"0.6\"/><rect x=\"138\" y=\"8.399999999999999\" width=\"4\" height=\"35.2\" rx=\"0\" fill=\"#222\" stroke=\"none\" stroke-width=\"0\"/><text x=\"145\" y=\"28\" text-anchor=\"start\" font-size=\"5\" font-weight=\"700\" fill=\"#444441\">shadow</text><text x=\"80\" y=\"42\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">object</text><text x=\"138\" y=\"57\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">screen</text><text x=\"24\" y=\"46\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">torch</text></svg>"}, {"id": "P4·5-15", "lv": 2, "q": "Your morning shadow points west. Where does your evening shadow point?", "qz": "早上影子指向西边。傍晚影子指向哪边?", "a": "East, the opposite direction.", "az": "东边,相反的方向。", "s": "The Sun rises in the East and sets in the West, so the shadows point in opposite directions.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><line x1=\"10\" y1=\"48\" x2=\"162\" y2=\"48\" stroke=\"#8A5A2B\" stroke-width=\"1.2\"/><path d=\"M20 48 Q86 -28 152 48\" fill=\"none\" stroke=\"#F5C542\" stroke-width=\"1\"/><text x=\"28\" y=\"40\" text-anchor=\"middle\" font-size=\"13\" font-family=\"Noto Color Emoji\">☀️</text><text x=\"86\" y=\"14\" text-anchor=\"middle\" font-size=\"13\" font-family=\"Noto Color Emoji\">☀️</text><text x=\"144\" y=\"40\" text-anchor=\"middle\" font-size=\"13\" font-family=\"Noto Color Emoji\">☀️</text><text x=\"28\" y=\"56\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">morning</text><text x=\"86\" y=\"28\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">noon</text><text x=\"144\" y=\"56\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">evening</text><line x1=\"86\" y1=\"48\" x2=\"86\" y2=\"36\" stroke=\"#444441\" stroke-width=\"3\"/><circle cx=\"86\" cy=\"34\" r=\"3\" fill=\"#444441\" stroke=\"none\" stroke-width=\"1\"/></svg>"}, {"id": "P4·5-16", "lv": 3, "q": "You walk towards a street lamp, under it, and away. How does your shadow change?", "qz": "你走向路灯,经过灯下,再走远。影子怎样变?", "a": "Shorter, then longer.", "az": "先变短,再变长。", "s": "The shadow is the shortest when I am directly under the lamp.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">💡</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">lamp</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🚶</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">walking →</text></svg>"}]}, {"code": "P4·6", "en": "HEAT", "zh": "热", "color": "#C0392B", "cards": [{"id": "P4·6-1", "lv": 1, "q": "A hot block touches a cold block. Which way does heat flow?", "qz": "热的和冷的碰在一起,热往哪边流?", "a": "From hotter to colder.", "az": "从热的流向冷的。", "s": "Heat flows from an object with a higher temperature to an object with a lower temperature.", "f": "热只会往低处“流”,像水往低处流。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"30\" y=\"12\" width=\"44\" height=\"28\" rx=\"1.5\" fill=\"#F4B6A0\" stroke=\"#D85A30\" stroke-width=\"1.2\"/><text x=\"52\" y=\"30\" text-anchor=\"middle\" font-size=\"8\" font-weight=\"700\" fill=\"#D85A30\">80°C</text><rect x=\"98\" y=\"12\" width=\"44\" height=\"28\" rx=\"1.5\" fill=\"#CFE6F8\" stroke=\"#378ADD\" stroke-width=\"1.2\"/><text x=\"120\" y=\"30\" text-anchor=\"middle\" font-size=\"8\" font-weight=\"700\" fill=\"#378ADD\">20°C</text><text x=\"86\" y=\"22\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#888780\">?</text><line x1=\"76\" y1=\"30\" x2=\"96\" y2=\"30\" stroke=\"#888780\" stroke-width=\"1.5\"/><text x=\"86\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">two blocks touching</text></svg>"}, {"id": "P4·6-2", "lv": 2, "q": "You hold ice and your hand feels cold. Why?", "qz": "手拿冰块觉得冷。为什么?", "a": "Your hand loses heat to the ice.", "az": "手的热流失给了冰。", "s": "The hand loses heat to the ice, so its temperature decreases.", "f": "没有“冷”在传递!只有热会流动。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">✋</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">hand</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🧊</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">ice</text></svg>"}, {"id": "P4·6-3", "lv": 1, "q": "What do we use to measure temperature? What is the unit?", "qz": "用什么量温度?单位是什么?", "a": "A thermometer. Degree Celsius (°C).", "az": "温度计。摄氏度。", "s": "Temperature is a measure of how hot or cold an object is.", "f": "温度 = 有多热。热 = 一种能量。两个不一样。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"86\" y=\"38\" text-anchor=\"middle\" font-size=\"30\" font-family=\"Noto Color Emoji\">🌡️</text><text x=\"86\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\"></text></svg>"}, {"id": "P4·6-4", "lv": 2, "q": "Why is a pot made of metal but its handle made of plastic?", "qz": "锅为什么用金属,把手却用塑料?", "a": "Metal: good conductor. Plastic: poor conductor.", "az": "金属是良导体,塑料是不良导体。", "s": "Metal is a good conductor of heat. Plastic is a poor conductor of heat.", "f": "锅要快热,手不要热。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><path d=\"M50 16 H110 V40 q0 6 -6 6 H56 q-6 0 -6 -6 Z\" fill=\"#BDBDBD\" stroke=\"#444441\" stroke-width=\"1.3\"/><rect x=\"110\" y=\"20\" width=\"34\" height=\"7\" rx=\"3\" fill=\"#333\" stroke=\"#444441\" stroke-width=\"1\"/><text x=\"80\" y=\"60\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Noto Color Emoji\">🔥</text><text x=\"40\" y=\"12\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">metal</text><line x1=\"44\" y1=\"14\" x2=\"54\" y2=\"20\" stroke=\"#888780\" stroke-width=\"0.8\"/><text x=\"150\" y=\"14\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">plastic handle</text><line x1=\"134\" y1=\"16\" x2=\"128\" y2=\"20\" stroke=\"#888780\" stroke-width=\"0.8\"/></svg>"}, {"id": "P4·6-5", "lv": 2, "q": "Which box keeps ice cream cold longer: metal or foam?", "qz": "金属盒和泡沫盒,哪个让冰淇淋冷得更久?", "a": "The foam (polystyrene) box.", "az": "泡沫(保丽龙)盒。", "s": "Polystyrene is a poor conductor of heat, so the ice cream gains heat slowly.", "f": "保冷和保热,用的是同一种材料。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"26\" y=\"12\" width=\"50\" height=\"30\" rx=\"1.5\" fill=\"#BDBDBD\" stroke=\"#444441\" stroke-width=\"1.2\"/><text x=\"51\" y=\"36\" text-anchor=\"middle\" font-size=\"16\" font-family=\"Noto Color Emoji\">🍦</text><text x=\"51\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">metal box</text><rect x=\"96\" y=\"12\" width=\"50\" height=\"30\" rx=\"4\" fill=\"#fff\" stroke=\"#444441\" stroke-width=\"1.2\"/><text x=\"121\" y=\"36\" text-anchor=\"middle\" font-size=\"16\" font-family=\"Noto Color Emoji\">🍦</text><text x=\"121\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">foam box</text></svg>"}, {"id": "P4·6-6", "lv": 2, "q": "A metal lid is stuck. Why does hot water help?", "qz": "金属瓶盖打不开。为什么淋热水有用?", "a": "The lid gains heat and expands.", "az": "瓶盖得到热,膨胀了。", "s": "The metal lid gains heat from the hot water and expands.", "f": "得热膨胀 expand,失热收缩 contract。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"70\" y=\"18\" width=\"32\" height=\"30\" rx=\"1.5\" fill=\"#EEF4FA\" stroke=\"#444441\" stroke-width=\"1.2\"/><rect x=\"66\" y=\"10\" width=\"40\" height=\"9\" rx=\"1.5\" fill=\"#BDBDBD\" stroke=\"#444441\" stroke-width=\"1.2\"/><text x=\"128\" y=\"26\" text-anchor=\"middle\" font-size=\"16\" font-family=\"Noto Color Emoji\">💧</text><text x=\"140\" y=\"40\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#D85A30\">hot water</text><text x=\"40\" y=\"16\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">metal lid</text><line x1=\"54\" y1=\"15\" x2=\"66\" y2=\"14\" stroke=\"#888780\" stroke-width=\"0.8\"/></svg>"}, {"id": "P4·6-7", "lv": 2, "q": "You mix 80°C water and 20°C water. Can it become 90°C?", "qz": "80°C 的水和 20°C 的水混合,会变成 90°C 吗?", "a": "No. It must be between 20°C and 80°C.", "az": "不会。一定在 20°C 和 80°C 之间。", "s": "The temperature of the mixture is between 20°C and 80°C.", "f": "混在一起不会比最热的还热。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"22.6\" y=\"24\" width=\"24.8\" height=\"20\" fill=\"#F4B6A0\"/><path d=\"M22 14 V44 H48 V14\" fill=\"none\" stroke=\"#444441\" stroke-width=\"1.3\"/><text x=\"35\" y=\"54\" text-anchor=\"middle\" font-size=\"7\" font-weight=\"700\" fill=\"#D85A30\">80°C</text><text x=\"62\" y=\"34\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#444441\">+</text><rect x=\"76.6\" y=\"24\" width=\"24.8\" height=\"20\" fill=\"#CFE6F8\"/><path d=\"M76 14 V44 H102 V14\" fill=\"none\" stroke=\"#444441\" stroke-width=\"1.3\"/><text x=\"89\" y=\"54\" text-anchor=\"middle\" font-size=\"7\" font-weight=\"700\" fill=\"#378ADD\">20°C</text><text x=\"116\" y=\"34\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#444441\">=</text><rect x=\"130.6\" y=\"18\" width=\"24.8\" height=\"26\" fill=\"#E5C7DA\"/><path d=\"M130 14 V44 H156 V14\" fill=\"none\" stroke=\"#444441\" stroke-width=\"1.3\"/><text x=\"143\" y=\"54\" text-anchor=\"middle\" font-size=\"7\" font-weight=\"700\" fill=\"#444441\">? °C</text></svg>"}, {"id": "P4·6-8", "lv": 2, "q": "Why does a thick jacket keep you warm?", "qz": "厚外套为什么保暖?", "a": "It traps air. Air is a poor conductor of heat.", "az": "它困住空气,空气是热的不良导体。", "s": "The trapped air is a poor conductor of heat, so heat from the body flows out slowly.", "f": "外套自己不发热,它只是不让你的热跑掉。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🧥</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">thick jacket</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">❄️</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">cold day</text></svg>"}, {"id": "P4·6-9", "lv": 1, "q": "What is heat?", "qz": "热是什么?", "a": "A form of energy.", "az": "一种能量。", "s": "Heat is a form of energy. It causes temperature to change.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🔥</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">heat</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌡️</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">temperature</text></svg>"}, {"id": "P4·6-10", "lv": 2, "q": "An object gains heat. What happens to its temperature?", "qz": "物体得到热。它的温度会怎样?", "a": "It increases.", "az": "升高。", "s": "When an object gains heat, its temperature increases.", "f": "失去热就反过来:loses heat, decreases。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🥛</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">cold milk</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">♨️</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">hot water</text></svg>"}, {"id": "P4·6-11", "lv": 2, "q": "How do you read a laboratory thermometer correctly?", "qz": "怎样正确读实验室温度计?", "a": "Bulb fully in. Wait. Read at eye level.", "az": "玻璃泡全浸入,等一等,眼睛平视读数。", "s": "Immerse the bulb fully. Wait for the red liquid to stop moving before reading.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context y=\"11\" r=\"2.6\" fill=\"#F5C542\" stroke=\"#8A5A2B\" stroke-width=\"0.5\"/><text x=\"121\" y=\"58\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">wood</text><text x=\"150\" y=\"14\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">wax</text><line x1=\"124\" y1=\"11\" x2=\"142\" y2=\"13\" stroke=\"#888780\" stroke-width=\"0.8\"/></svg>"}, {"id": "P4·6-15", "lv": 2, "q": "A hot metal ball cannot pass through the ring. After cooling, it can. Why?", "qz": "热的金属球穿不过环,冷却后可以。为什么?", "a": "It loses heat and contracts.", "az": "它失去热,收缩了。", "s": "When the metal ball loses heat, it contracts.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><circle cx=\"56\" cy=\"28\" r=\"12\" fill=\"#888780\" stroke=\"#444441\" stroke-width=\"1\"/><text x=\"56\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">hot metal ball</text><circle cx=\"116\" cy=\"28\" r=\"11\" fill=\"none\" stroke=\"#444441\" stroke-width=\"3\"/><text x=\"116\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">metal ring</text></svg>"}, {"id": "P4·6-16", "lv": 3, "q": "Hot water and cold water are in contact. When does heat stop flowing?", "qz": "热水和冷水接触。热什么时候停止流动?", "a": "When both have the same temperature.", "az": "两边温度一样的时候。", "s": "There is no more heat flow when both reach the same temperature.", "f": "图上两条线合成一条的地方。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><line x1=\"30\" y1=\"48\" x2=\"150\" y2=\"48\" stroke=\"#444441\" stro const KEY="bqsci.v1";
let st={u:0,i:0,k:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&typeof s==="object"){st.u=Math.min(s.u|0,U.length-1);st.i=s.i|0;st.k=(s.k&&typeof s.k==="object")?s.k:{};
  if(s.known&&typeof s.known==="object")for(const id in s.known)if(s.known[id]&&!st.k[id])st.k[id]=[1,0];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({u:st.u,i:st.i,k:st.k}))}catch(e){}}
const isK=id=>!!(st.k[id]&&st.k[id][0]===1);
function mark(id,v){st.k[id]=[v?1:0,Date.now()];save();Sync.push();}
const $=id=>document.getElementById(id);
/* 家庭存档: same Firebase database and 8-letter family code as the study handbook (same site, so a phone that
   already joined the handbook joins here too). Each card keeps [state, time]; phones merge by newest time. */
const Sync=(function(){
  const DB="https://xiaoxiao-sync-default-rtdb.asia-southeast1.firebasedatabase.app",CK="xx-sync-code",TK="bqsci-sync-at";
  const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}},put=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,String(v))}catch(e){}};
  const clean=c=>String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  const code=()=>{const c=clean(get(CK));return c.length===8?c:""};
  const pretty=c=>c.slice(0,4)+"-"+c.slice(4);
  const url=c=>DB+"/sync/"+c+"/cards.json";
  let state="",timer=null,busy=false,again=false,msgT="";
  function when(t){if(!t)return "";const d=new Date(+t),n=new Date(),p=x=>(x<10?"0":"")+x;return (d.toDateString()===n.toDateString()?"今天 ":(d.getMonth()+1)+"/"+d.getDate()+" ")+p(d.getHours())+":"+p(d.getMinutes())}
  function merge(remote){let changed=false;if(!remote)return false;
    for(const id in remote){const r=remote[id];if(!Array.isArray(r))continue;const l=st.k[id];if(!l||(+r[1]||0)>(+l[1]||0)){st.k[id]=[r[0]?1:0,+r[1]||0];changed=true}}return changed}
  function pull(c){return fetch(url(c),{cache:"no-store"}).then(r=>{if(r.status===401||r.status===403)throw "rules";if(!r.ok)throw "net";return r.json()}).then(x=>x&&x.v?JSON.parse(x.v):null)}
  function sync(){const c=code();if(!c||!navigator.onLine&&navigator.onLine!==undefined){paint();return}
    if(busy){again=true;return}busy=true;state="busy";paint();
    pull(c).then(rem=>{const ch=merge(rem&&rem.k);if(ch){save();refreshCounts()}
      const body={at:Date.now(),v:JSON.stringify({k:st.k})};
      return fetch(url(c),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(r=>{if(r.status===401||r.status===403)throw "rules";if(!r.ok)throw "net";put(TK,body.at);state="ok"})})
    .catch(e=>{state=e==="rules"?"rules":"net"}).then(()=>{busy=false;paint();if(again){again=false;setTimeout(sync,500)}})}
  function push(){if(!code())return;clearTimeout(timer);timer=setTimeout(sync,1500)}
  function paint(){const cb=document.getElementById("cloudBtn");if(cb){const c0=code();cb.classList.toggle("on",!!c0);cb.innerHTML=c0?(state==="net"||state==="rules"?"☁ 存档 ⚠":"☁ 存档 ✓"):"☁ 连存档"}
  const el=document.getElementById("syncBox");if(!el)return;const c=code();let h;
    if(c){h=`<b class="t ok">✓ 家庭存档已连上</b> <span class="m">· 存档码 <b>${pretty(c)}</b>${get(TK)?" · 上次同步 "+when(get(TK)):""}</span>`+
      (state==="busy"?'<div class="m">正在同步……</div>':state==="net"?'<div class="m">现在连不上网络,有网时会自动同步。</div>':state==="rules"?'<div class="m">数据库不让读写:Firebase 里的“规则”还没设置好。</div>':"")+
      `<div class="m">家里每台手机输同一个存档码,“会了”的卡就会一起更新。</div><div class="r"><button class="g" data-s="now">现在同步</button><button class="g" data-s="off">断开</button></div>`}
    else{h=`<div class="m">输入家长手册里的 8 位同步码,爸妈和小小的手机就用同一个存档。</div>`+
      `<div class="r"><input id="syncIn" maxlength="9" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="比如 K7QM-3XPA" aria-label="存档码"><button data-s="go">连上</button></div><div class="m" id="syncMsg">${msgT}</div>`}
    el.innerHTML=h}
  document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("#syncBox [data-s]");if(!b)return;const a=b.getAttribute("data-s");
    if(a==="go"){const v=clean(document.getElementById("syncIn").value);if(v.length!==8){msgT="存档码是 8 位,字母和数字。";paint();return}
      msgT="正在连……";paint();pull(v).then(rem=>{put(CK,v);msgT="";merge(rem&&rem.k);save();refreshCounts();sync()},e=>{msgT=e==="rules"?"数据库不让读写:Firebase 里的“规则”还没设置好。":"现在连不上网络,等一下再试。";paint()})}
    if(a==="now")sync();
    if(a==="off"){put(CK,null);put(TK,null);state="";paint()}});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){sync();setTimeout(fit,300)}else if(timer){clearTimeout(timer);sync()}});
  addEventListener("online",sync);
  return {push,paint,sync};
})();

const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stars=n=>"★".repeat(n)+"☆".repeat(3-n);
const CW=355.28,CH=234.33;
let flipped=false;
function front(u,c,i){return `<div class="card"><div class="band fr" style="background:${u.color}"><span class="code">${u.code}</span> ${u.en} ${u.zh}<span class="qn">Q${i+1}</span><span class="st">${stars(c.lv)}</span></div><div class="q">${esc(c.q)}</div><div class="qz">${c.qz}</div><div class="img">${c.pic}</div></div>`}
function back(u,c,i){return `<div class="card bk"><div class="band ab"><span class="code">${u.code}</span> ANSWER 答案<span class="qn">Q${i+1}</span></div><div class="a">${esc(c.a)}</div><div class="az">${c.az}</div><div class="sp"></div><div class="say"><span class="lab">★ 拿分魔法句</span>${esc(c.s)}</div>${c.f?`<div class="fun" style="border-color:${u.color}">${esc(c.f)}</div>`:""}</div>`}
function knownCount(u){return U[u].cards.filter(c=>isK(c.id)).length}
function fit(){if(window.CSS&&CSS.supports&&CSS.supports("height","1cqh"))return;const s=$("stage"),r=s.getBoundingClientRect();const vh=(window.visualViewport?visualViewport.height:innerHeight);const h=Math.min(r.height,vh-r.top-8);const u=Math.max(1,Math.min((r.width-4)/94,(h-24)/62));$("flip").style.setProperty("--u",u+"px")}
function render(){
  const u=U[st.u];if(st.i>=u.cards.length)st.i=0;
  const c=u.cards[st.i];
  $("uDot").style.background=u.color;$("uDot").textContent=u.code.replace("P","");
  $("uName").textContent=u.zh;
  $("prog").innerHTML=`第 ${st.i+1} / ${u.cards.length} 张 · 会了 <b>${knownCount(st.u)}</b>`;
  const allDone=knownCount(st.u)===u.cards.length;
  $("done").classList.toggle("on",allDone);$("flip").style.visibility=allDone?"hidden":"visible";$("tapHint").style.visibility=allDone?"hidden":"visible";
  document.querySelector(".face.f").innerHTML=`<div class="scaler x">${front(u,c,st.i)}</div>`;
  document.querySelector(".face.b").innerHTML=`<div class="scaler x">${back(u,c,st.i)}</div>`;
  setFlip(false,true);fit();save();
}
function refreshCounts(){const u=U[st.u];$("prog").innerHTML=`第 ${st.i+1} / ${u.cards.length} 张 · 会了 <b>${knownCount(st.u)}</b>`;if($("sheet").classList.contains("on"))openSheet();}
function setFlip(on,instant){
  flipped=on;const f=$("flip");
  if(instant){f.style.transition="none";f.classList.toggle("on",on);f.offsetWidth;f.style.transition=""}else f.classList.toggle("on",on);
  $("nextBtn").style.display=on?"none":"";$("knowBtn").style.display=on?"":"none";$("againBtn").style.display=on?"":"none";
}
function nextIdx(from){const cs=U[st.u].cards;for(let k=1;k<=cs.length;k++){const j=(from+k)%cs.length;if(!isK(cs[j].id))return j}return -1}
function go(dir){
  const cs=U[st.u].cards;
  if(dir<0){st.i=(st.i-1+cs.length)%cs.length;render();return}
  const j=nextIdx(st.i);if(j<0){render();return}st.i=j;render();
}
$("flipBtn").onclick=()=>setFlip(!flipped);
$("stage").addEventListener("click",e=>{if(e.target.closest("#done"))return;setFlip(!flipped)});
$("nextBtn").onclick=()=>go(1);
$("knowBtn").onclick=()=>{mark(U[st.u].cards[st.i].id,1);go(1)};
$("againBtn").onclick=()=>{mark(U[st.u].cards[st.i].id,0);go(1)};
$("resetBtn").onclick=e=>{e.stopPropagation();U[st.u].cards.forEach(c=>{if(isK(c.id))st.k[c.id]=[0,Date.now()]});save();Sync.push();st.i=0;render()};
$("pickBtn").onclick=e=>{e.stopPropagation();openSheet()};
let sx=null,sy=null;
$("stage").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("stage").addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){e.preventDefault();go(dx<0?1:-1)}});
function openSheet(){
  ["g3","g4"].forEach(g=>$(g).innerHTML="");
  U.forEach((u,k)=>{const b=document.createElement("button");b.className="tile"+(k===st.u?" cur":"");b.style.background=u.color;const n=knownCount(k);
    b.innerHTML=`<span class="c">${u.code}</span><span class="n">${u.zh}</span><span class="p">会了 ${n}/${u.cards.length}</span>${n===u.cards.length?'<span class="s">★</span>':""}`;
    b.onclick=()=>{st.u=k;st.i=nextIdx(-1)<0?0:nextIdx(-1);closeSheet();render()};
    $(u.code.startsWith("P3")?"g3":"g4").appendChild(b)});
  $("sheet").classList.add("on");
}
function closeSheet(){$("sheet").classList.remove("on")}

$("closeSave").onclick=()=>$("saveSheet").classList.remove("on");

try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock("landscape").catch(()=>{})}catch(e){}
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{r.update();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")r.update()})}).catch(()=>{}));
  let reloaded=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!reloaded){reloaded=true;location.reload()}})}
render();Sync.paint();Sync.sync();
