ext-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">metal</text><text x=\"146\" y=\"53\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">spoon</text></svg>"}, {"id": "P3·4-8", "lv": 3, "q": "Which material is best for an umbrella: A, B or C?", "qz": "A、B、C 哪种材料最适合做雨伞?", "a": "C. No water passed through. It is waterproof.", "az": "C。水一点都没漏过去,它防水。", "s": "Material C is waterproof, so it keeps the user dry.", "f": "雨伞要漏水最少的,不是最多的。选 B 的人会变落汤鸡。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"28.6\" y=\"35\" width=\"24.8\" height=\"7\" fill=\"#CFE6F8\"/><path d=\"M28 14 V42 H54 V14\" fill=\"none\" stroke=\"#444441\" stroke-width=\"1.3\"/><text x=\"41\" y=\"50\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">A: 50 ml</text><rect x=\"78.6\" y=\"21\" width=\"24.8\" height=\"21\" fill=\"#CFE6F8\"/><path d=\"M78 14 V42 H104 V14\" fill=\"none\" stroke=\"#444441\" stroke-width=\"1.3\"/><text x=\"91\" y=\"50\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">B: 150 ml</text><path d=\"M128 14 V42 H154 V14\" fill=\"none\" stroke=\"#444441\" stroke-width=\"1.3\"/><text x=\"141\" y=\"50\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">C: 0 ml</text><text x=\"86\" y=\"58\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\">water that passed through each material</text><path d=\"M24 12 q17 -6 34 0\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"2\"/><path d=\"M74 12 q17 -6 34 0\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"2\"/><path d=\"M124 12 q17 -6 34 0\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"2\"/></svg>"}, {"id": "P3·4-9", "lv": 1, "q": "Where does wood come from? What is glass made from?", "qz": "木头从哪里来?玻璃用什么做?", "a": "Wood: trees. Glass: sand.", "az": "木头来自树,玻璃用沙子做。", "s": "Wood comes from trees. Glass is made from sand.", "f": "沙子加热到熔化,冷了就是玻璃。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌳</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">→ ?</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🏖️</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">→ ?</text></svg>"}, {"id": "P3·4-10", "lv": 1, "q": "Wool, silk and cotton: where do they come from?", "qz": "羊毛、丝、棉,各从哪里来?", "a": "Sheep, silkworms and a plant.", "az": "羊、蚕、植物。", "s": "Fabric can come from animals or plants.", "f": "你的毛衣以前是羊的外套。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"28.666666666666668\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🐑</text><text x=\"28.666666666666668\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">?</text><text x=\"86.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🐛</text><text x=\"86.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">?</text><text x=\"143.33333333333334\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌱</text><text x=\"143.33333333333334\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">?</text></svg>"}, {"id": "P3·4-11", "lv": 2, "q": "What does 'waterproof' mean?", "qz": "waterproof(防水)是什么意思?", "a": "It does not absorb water.", "az": "不吸水。", "s": "A waterproof material does not absorb water at all.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"28.666666666666668\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">☔</text><text x=\"28.666666666666668\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">umbrella</text><text x=\"86.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🧥</text><text x=\"86.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">raincoat</text><text x=\"143.33333333333334\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🥾</text><text x=\"143.33333333333334\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">boots</text></svg>"}, {"id": "P3·4-12", "lv": 2, "q": "A ceramic tile breaks when it is bent. Is it flexible or rigid?", "qz": "瓷砖一弯就断。它是 flexible 还是 rigid?", "a": "Rigid.", "az": "Rigid(不能弯)。", "s": "Materials that break easily when bent are rigid.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🧱</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">tile</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">💥</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">snap!</text></svg>"}, {"id": "P3·4-13", "lv": 2, "q": "Metal sinks. So why can a metal ship float?", "qz": "金属会沉。那金属做的船为什么能浮?", "a": "There is a lot of trapped air inside.", "az": "船里面有很多空气。", "s": "The trapped air inside the ship helps it to float on water.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"86\" y=\"38\" text-anchor=\"middle\" font-size=\"28\" font-family=\"Noto Color Emoji\">🚢</text><text x=\"86\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">metal ship</text></svg>"}, {"id": "P3·4-14", "lv": 2, "q": "Why are curtains made of fabric?", "qz": "窗帘为什么用布做?", "a": "Fabric is flexible.", "az": "布是柔韧的。", "s": "Fabric is flexible, so the curtain can be folded at the side of the window.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🪟</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">window</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🧵</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">fabric</text></svg>"}, {"id": "P3·4-15", "lv": 2, "q": "Why is a shopping trolley made of metal?", "qz": "购物手推车为什么用金属做?", "a": "Metal is rigid and strong.", "az": "金属不会弯,也很坚固。", "s": "Metal is rigid, so the trolley can hold heavy groceries without bending.", "f": "玻璃做的手推车?撞一下就没了。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"86\" y=\"38\" text-anchor=\"middle\" font-size=\"28\" font-family=\"Noto Color Emoji\">🛒</text><text x=\"86\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">trolley</text></svg>"}, {"id": "P3·4-16", "lv": 3, "q": "For the lens of spectacles: A lets most light through, B lets none. Which one?", "qz": "做眼镜片:A 让大部分光通过,B 完全不透光。选哪个?", "a": "A.", "az": "A。", "s": "Material A is transparent, so the user can see clearly through the lens.", "f": "三段:材料 + 性质 + 对用途的好处。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">👓</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">lens</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">❓</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">A or B</text></svg>"}]}, {"code": "P3·5", "en": "PLANT LIFE CYCLE", "zh": "植物生命周期", "color": "#4E8B3A", "cards": [{"id": "P3·5-1", "lv": 1, "q": "What are the 3 stages of a flowering plant?", "qz": "开花植物的生命周期有哪 3 个阶段?", "a": "Seed, young plant, adult plant.", "az": "种子、幼苗、成株。", "s": "The three stages are the seed, the young plant and the adult plant.", "f": "然后成株又结种子,一直转圈圈。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><ellipse cx=\"28.666666666666668\" cy=\"24\" rx=\"6\" ry=\"4.5\" fill=\"#8A5A2B\"/><text x=\"28.666666666666668\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">seed</text><line x1=\"47.013333333333335\" y1=\"23\" x2=\"67.65333333333334\" y2=\"23\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"/><text x=\"86.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌱</text><text x=\"86.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">?</text><line x1=\"104.34666666666666\" y1=\"23\" x2=\"124.98666666666668\" y2=\"23\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"/><text x=\"143.33333333333334\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌳</text><text x=\"143.33333333333334\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">adult plant</text></svg>"}, {"id": "P3·5-2", "lv": 1, "q": "What does a seed need to germinate?", "qz": "种子发芽(germinate)需要什么?", "a": "Water, air and a suitable temperature.", "az": "水、空气和适合的温度。", "s": "A seed needs water, air and a suitable temperature to germinate.", "f": "注意:没有“阳光”!", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"21.5\" y=\"32\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Noto Color Emoji\">💧</text><text x=\"21.5\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">water?</text><text x=\"64.5\" y=\"32\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Noto Color Emoji\">💨</text><text x=\"64.5\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">air?</text><text x=\"107.5\" y=\"32\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Noto Color Emoji\">🌡️</text><text x=\"107.5\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">warmth?</text><text x=\"150.5\" y=\"32\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Noto Color Emoji\">☀️</text><text x=\"150.5\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">light?</text></svg>"}, {"id": "P3·5-3", "lv": 2, "q": "Can a seed start to grow in the dark?", "qz": "种子在黑暗里能发芽吗?", "a": "Yes. It uses its stored food.", "az": "能。它用种子里储存的养分。", "s": "A seed does not need light to germinate. It uses its stored food.", "f": "种子自带便当,不用晒太阳。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"54\" y=\"6\" width=\"64\" height=\"40\" rx=\"1.5\" fill=\"#3A3A38\" stroke=\"#444441\" stroke-width=\"1.2\"/><ellipse cx=\"86\" cy=\"32\" rx=\"6\" ry=\"4.5\" fill=\"#8A5A2B\"/><path d=\"M86 32 q-2 -8 4 -12\" fill=\"none\" stroke=\"#9BD18B\" stroke-width=\"2\"/><text x=\"86\" y=\"55\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">in a dark cupboard</text></svg>"}, {"id": "P3·5-4", "lv": 2, "q": "Does a fern grow from seeds?", "qz": "蕨类是从种子长出来的吗?", "a": "No. A fern reproduces by spores.", "az": "不是。蕨类靠孢子繁殖。", "s": "A fern is a non-flowering plant. It reproduces by spores.", "f": "蕨类不开花,不结果,也没有种子。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"86\" y=\"38\" text-anchor=\"middle\" font-size=\"28\" font-family=\"Noto Color Emoji\">🌿</text><text x=\"86\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">fern: no flowers</text></svg>"}, {"id": "P3·5-5", "lv": 2, "q": "Which part grows out of a seed first?", "qz": "种子最先长出哪个部分?", "a": "The root.", "az": "根。", "s": "The root grows out of the seed first.", "f": "先找水喝,再长高。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><line x1=\"20\" y1=\"26\" x2=\"152\" y2=\"26\" stroke=\"#8A5A2B\" stroke-width=\"1.2\"/><ellipse cx=\"86\" cy=\"26\" rx=\"6\" ry=\"4.5\" fill=\"#8A5A2B\"/><text x=\"86\" y=\"14\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">shoot?</text><line x1=\"86\" y1=\"22\" x2=\"86\" y2=\"17\" stroke=\"#888780\" stroke-width=\"1.2\" marker-end=\"url(#ah)\"/><text x=\"86\" y=\"54\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">root?</text><line x1=\"86\" y1=\"34\" x2=\"86\" y2=\"44\" stroke=\"#888780\" stroke-width=\"1.2\" marker-end=\"url(#ah)\"/></svg>"}, {"id": "P3·5-6", "lv": 2, "q": "As a seedling grows, its seed leaves get smaller. Why?", "qz": "幼苗长大,子叶却变小了。为什么?", "a": "The food stored in them is used up.", "az": "里面储存的养分被用掉了。", "s": "The seed leaves become smaller because the stored food is used up.", "f": "便当吃完了,饭盒就瘪了。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><line x1=\"20\" y1=\"48\" x2=\"152\" y2=\"48\" stroke=\"#8A5A2B\" stroke-width=\"1.2\"/><line x1=\"60\" y1=\"48\" x2=\"60\" y2=\"28\" stroke=\"#5BA84A\" stroke-width=\"2\"/><ellipse cx=\"52\" cy=\"26\" rx=\"9\" ry=\"5\" fill=\"#9BD18B\"/><ellipse cx=\"68\" cy=\"26\" rx=\"9\" ry=\"5\" fill=\"#9BD18B\"/><line x1=\"116\" y1=\"48\" x2=\"116\" y2=\"14\" stroke=\"#5BA84A\" stroke-width=\"2\"/><ellipse cx=\"111\" cy=\"30\" rx=\"4\" ry=\"2.5\" fill=\"#D8D08A\"/><ellipse cx=\"121\" cy=\"30\" rx=\"4\" ry=\"2.5\" fill=\"#D8D08A\"/><ellipse cx=\"108\" cy=\"14\" rx=\"8\" ry=\"4\" fill=\"#5BA84A\"/><ellipse cx=\"124\" cy=\"14\" rx=\"8\" ry=\"4\" fill=\"#5BA84A\"/><line x1=\"78\" y1=\"32\" x2=\"98\" y2=\"32\" stroke=\"#888780\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"/><text x=\"40\" y=\"14\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">seed leaves</text><line x1=\"46\" y1=\"16\" x2=\"52\" y2=\"22\" stroke=\"#888780\" stroke-width=\"0.8\"/><text x=\"146\" y=\"34\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"700\" fill=\"#444441\">smaller</text></svg>"}, {"id": "P3·5-7", "lv": 1, "q": "Where are the seeds of a flowering plant?", "qz": "开花植物的种子在哪里?", "a": "Inside the fruit.", "az": "在果实里面。", "s": "The seeds of a flowering plant are found in the fruits.", "f": "所以吃西瓜要吐籽。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"28.666666666666668\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌸</text><text x=\"28.666666666666668\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">flower</text><line x1=\"47.013333333333335\" y1=\"23\" x2=\"67.65333333333334\" y2=\"23\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"/><text x=\"86.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🍎</text><text x=\"86.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">fruit</text><line x1=\"104.34666666666666\" y1=\"23\" x2=\"124.98666666666668\" y2=\"23\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"/><ellipse cx=\"143.33333333333334\" cy=\"24\" rx=\"6\" ry=\"4.5\" fill=\"#8A5A2B\"/><text x=\"143.33333333333334\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">seeds: where?</text></svg>"}, {"id": "P3·5-8", "lv": 3, "q": "In the dark, which seedling lives longer: from a big seed or a small seed?", "qz": "在黑暗里,大种子和小种子的幼苗,哪个活得久?", "a": "The big seed. It has more stored food.", "az": "大种子。它储存的养分比较多。", "s": "The big seed has more stored food, so its seedling lives longer.", "f": "便当大,撑得久。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"30\" y=\"4\" width=\"112\" height=\"44\" rx=\"1.5\" fill=\"#3A3A38\" stroke=\"#444441\" stroke-width=\"1.2\"/><ellipse cx=\"62\" cy=\"34\" rx=\"4\" ry=\"3\" fill=\"#E8C48A\"/><ellipse cx=\"112\" cy=\"32\" rx=\"9\" ry=\"6.5\" fill=\"#E8C48A\"/><text x=\"62\" y=\"20\" text-anchor=\"middle\" font-size=\"6\" font-weight=\"700\" fill=\"#fff\">small seed</text><text x=\"112\" y=\"18\" text-anchor=\"middle\" font-size=\"6\" font-weight=\"700\" fill=\"#fff\">big seed</text><text x=\"86\" y=\"56\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">dark cupboard: no light</text></svg>"}, {"id": "P3·5-9", "lv": 1, "q": "What is a life cycle?", "qz": "什么是生命周期?", "a": "A repeated pattern of change.", "az": "一再重复的变化过程。", "s": "A life cycle is a repeated pattern of change as a living thing grows over time and reproduces.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><ellipse cx=\"28.666666666666668\" cy=\"24\" rx=\"6\" ry=\"4.5\" fill=\"#8A5A2B\"/><text x=\"28.666666666666668\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">seed</text><line x1=\"47.013333333333335\" y1=\"23\" x2=\"67.65333333333334\" y2=\"23\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"/><text x=\"86.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌱</text><text x=\"86.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">young plant</text><line x1=\"104.34666666666666\" y1=\"23\" x2=\"124.98666666666668\" y2=\"23\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"/><text x=\"143.33333333333334\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌳</text><text x=\"143.33333333333334\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">adult plant</text></svg>"}, {"id": "P3·5-10", "lv": 2, "q": "Why are life cycles important?", "qz": "生命周期为什么重要?", "a": "So the same kind can continue to live.", "az": "让同一种生物延续下去。", "s": "Life cycles ensure that living things of the same kind can continue to live on Earth.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"28.666666666666668\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌳</text><text x=\"28.666666666666668\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">adult</text><text x=\"86.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🍎</text><text x=\"86.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">fruit</text><text x=\"143.33333333333334\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌱</text><text x=\"143.33333333333334\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">young</text></svg>"}, {"id": "P3·5-11", "lv": 1, "q": "Which stage of a plant bears flowers and fruits?", "qz": "植物哪个阶段开花结果?", "a": "The adult plant.", "az": "成株。", "s": "The adult plant bears flowers. The flowers develop into fruits.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><ellipse cx=\"28.666666666666668\" cy=\"24\" rx=\"6\" ry=\"4.5\" fill=\"#8A5A2B\"/><text x=\"28.666666666666668\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">seed</text><line x1=\"47.013333333333335\" y1=\"23\" x2=\"67.65333333333334\" y2=\"23\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"/><text x=\"86.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌱</text><text x=\"86.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">?</text><line x1=\"104.34666666666666\" y1=\"23\" x2=\"124.98666666666668\" y2=\"23\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"/><text x=\"143.33333333333334\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌳</text><text x=\"143.33333333333334\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">adult plant</text></svg>"}, {"id": "P3·5-12", "lv": 1, "q": "What tool measures how tall a plant has grown?", "qz": "用什么工具量植物长多高?", "a": "A ruler.", "az": "尺子。", "s": "We can use a ruler to measure the height of the plant.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌱</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">plant</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">❓</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">tool</text></svg>"}, {"id": "P3·5-13", "lv": 2, "q": "After the adult plant, what comes next in the cycle?", "qz": "成株之后,下一个阶段是什么?", "a": "The seed again.", "az": "又回到种子。", "s": "The adult plant produces seeds, and the cycle repeats.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌳</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">adult</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">❓</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">next</text></svg>"}, {"id": "P3·5-14", "lv": 2, "q": "A young plant gets no water for many days. What will happen?", "qz": "幼苗很多天没有水。会怎样?", "a": "It will die.", "az": "它会死。", "s": "Plants need water to survive and to make food.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌱</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">day 1</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🥀</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">day 10</text></svg>"}, {"id": "P3·5-15", "lv": 2, "q": "What does a seed bank do?", "qz": "种子库是做什么的?", "a": "It stores seeds safely.", "az": "把种子安全地保存起来。", "s": "A seed bank protects the seeds of plants that are in danger of dying out.", "f": "这个银行存的不是钱。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🍎</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">plants</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🏦</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">bank</text></svg>"}, {"id": "P3·5-16", "lv": 3, "q": "Height: week 1 is 2 cm, w  fill=\"context-stroke\"/></marker></defs><text x=\"86\" y=\"38\" text-anchor=\"middle\" font-size=\"28\" font-family=\"Noto Color Emoji\">EGGS</text><text x=\"86\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">frog eggs</text></svg>"}, {"id": "P3·6-12", "lv": 2, "q": "Frog and grasshopper life cycles: give one similarity.", "qz": "青蛙和蚱蜢的生命周期:说一个相同点。", "a": "Both have three stages.", "az": "都是三个阶段。", "s": "Both the frog and the grasshopper have three stages in their life cycles.", "f": "相同点用 Both … 开头。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🐸</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">frog</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🦗</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">grasshopper</text></svg>"}, {"id": "P3·6-13", "lv": 2, "q": "Frog and mosquito life cycles: give one difference.", "qz": "青蛙和蚊子的生命周期:说一个不同点。", "a": "3 stages and 4 stages.", "az": "3 个阶段和 4 个阶段。", "s": "The frog has three stages but the mosquito has four stages in its life cycle.", "f": "不同点两边都要写:… but …", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🐸</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">frog</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🦟</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">mosquito</text></svg>"}, {"id": "P3·6-14", "lv": 2, "q": "Which stage is the first stage of a life cycle?", "qz": "生命周期的第一个阶段是哪个?", "a": "None. It is a cycle.", "az": "没有。它是一个循环。", "s": "The stages in a life cycle are repeated. There is no first or last stage.", "f": "先有鸡还是先有蛋?科学答案:都不是。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🐔</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">hen</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🥚</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">egg</text></svg>"}, {"id": "P3·6-15", "lv": 2, "q": "Why should we remove stagnant water at home?", "qz": "为什么要清掉家里的积水?", "a": "To stop mosquitoes from breeding.", "az": "不让蚊子繁殖。", "s": "Mosquitoes lay their eggs in stagnant water.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"50\" y=\"38\" text-anchor=\"middle\" font-size=\"26\" font-family=\"Noto Color Emoji\">🦟</text><rect x=\"100.6\" y=\"28\" width=\"34.8\" height=\"18\" fill=\"#CFE6F8\"/><path d=\"M100 18 V46 H136 V18\" fill=\"none\" st t></svg>"}, {"id": "P3·8-2", "lv": 2, "q": "10 strokes or 30 strokes: which nail is the stronger magnet?", "qz": "摩擦 10 次和 30 次,哪根钉子磁力更强?", "a": "30 strokes. More strokes, stronger magnet.", "az": "30 次。次数越多,磁力越强。", "s": "As the number of strokes increases, the magnet becomes stronger.", "f": "结论句:As the number of strokes increases, ...", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"50\" y=\"12\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">10 strokes</text><rect x=\"36\" y=\"18\" width=\"26\" height=\"3\" fill=\"#888780\"/><rect x=\"32\" y=\"15\" width=\"4\" height=\"9\" fill=\"#888780\"/><path d=\"M40 26 h7 a3.5 3.5 0 0 1 0 7 h-5 a2.5 2.5 0 0 1 0 -5 h4\" fill=\"none\" stroke=\"#888780\" stroke-width=\"1.5\"/><path d=\"M52 26 h7 a3.5 3.5 0 0 1 0 7 h-5 a2.5 2.5 0 0 1 0 -5 h4\" fill=\"none\" stroke=\"#888780\" stroke-width=\"1.5\"/><text x=\"122\" y=\"12\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">30 strokes</text><rect x=\"108\" y=\"18\" width=\"26\" height=\"3\" fill=\"#888780\"/><rect x=\"104\" y=\"15\" width=\"4\" height=\"9\" fill=\"#888780\"/><path d=\"M104 26 h7 a3.5 3.5 0 0 1 0 7 h-5 a2.5 2.5 0 0 1 0 -5 h4\" fill=\"none\" stroke=\"#888780\" stroke-width=\"1.5\"/><path d=\"M115 26 h7 a3.5 3.5 0 0 1 0 7 h-5 a2.5 2.5 0 0 1 0 -5 h4\" fill=\"none\" stroke=\"#888780\" stroke-width=\"1.5\"/><path d=\"M126 26 h7 a3.5 3.5 0 0 1 0 7 h-5 a2.5 2.5 0 0 1 0 -5 h4\" fill=\"none\" stroke=\"#888780\" stroke-width=\"1.5\"/><path d=\"M137 26 h7 a3.5 3.5 0 0 1 0 7 h-5 a2.5 2.5 0 0 1 0 -5 h4\" fill=\"none\" stroke=\"#888780\" stroke-width=\"1.5\"/><text x=\"86\" y=\"50\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">count the clips</text></svg>"}, {"i 37.0 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><path d=\"M141.0 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><rect x=\"108\" y=\"8\" width=\"12\" height=\"7\" rx=\"1.5\" fill=\"#fff\" stroke=\"#444441\" stroke-width=\"0.9\"/><rect x=\"122\" y=\"8\" width=\"12\" height=\"7\" rx=\"1.5\" fill=\"#fff\" stroke=\"#444441\" stroke-width=\"0.9\"/><rect x=\"136\" y=\"8\" width=\"12\" height=\"7\" rx=\"1.5\" fill=\"#fff\" stroke=\"#444441\" stroke-width=\"0.9\"/><path d=\"M108 12 H102 V30 H104 M148 12 H154 V30 H150\" fill=\"none\" stroke=\"#444441\" stroke-width=\"0.9\"/><text x=\"127\" y=\"44\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">3 batteries, 9 turns</text><text x=\"86\" y=\"55\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\">Which one lifts more clips?</text></svg>"}, {"id": "P3·8-4", "lv": 1, "q": "You remove the battery from an electromagnet. What happens?", "qz": "把电磁铁的电池拿走,会怎样?", "a": "It is no longer a magnet. The clips fall.", "az": "它不再有磁性,回形针掉下来。", "s": "The iron nail is no longer a magnet, so the steel clips fall off.", "f": "没电就下班。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"62\" y=\"26\" width=\"46\" height=\"7\" rx=\"1.5\" fill=\"#888780\" stroke=\"#444441\" stroke-width=\"0.8\"/><path d=\"M67.0 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><path d=\"M73.0 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><path d=\"M79.0 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><path d=\"M85.0 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><path d=\"M91.0 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><path d=\"M97.0 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><path d=\"M66 12 H60 V30 H62 M64 12 H112 V30 H108\" fill=\"none\" stroke=\"#444441\" stroke-width=\"0.9\"/><text x=\"85\" y=\"44\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">no battery now</text><text x=\"86\" y=\"56\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\">What happens to the clips?</text></svg>"}, {"id": "P3·8-5", "lv": 2, "q": "You stroke a copper rod 30 times. How many pins can it pick up?", "qz": "把铜棒摩擦 30 次,它能吸起几根针?", "a": "0. Copper is a non-magnetic material.", "az": "0 根。铜是非磁性材料。", "s": "Copper is a non-magnetic material. It cannot be made into a magnet.", "f": "擦到手酸也没用。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"20\" y=\"4\" width=\"20.0\" height=\"13\" fill=\"#D85A30\"/><rect x=\"40.0\" y=\"4\" width=\"20.0\" height=\"13\" fill=\"#378ADD\"/><text x=\"30.0\" y=\"13.3\" text-anchor=\"middle\" font-size=\"8\" font-weight=\"700\" fill=\"#fff\">N</text><text x=\"50.0\" y=\"13.3\" text-anchor=\"middle\" font-size=\"8\" font-weight=\"700\" fill=\"#fff\">S</text><rect x=\"26\" y=\"30\" width=\"120\" height=\"10\" rx=\"1.5\" fill=\"#B8743C\" stroke=\"#444441\" stroke-width=\"1.2\"/><text x=\"86\" y=\"38\" text-anchor=\"middle\" font-size=\"6\" font-weight=\"700\" fill=\"#fff\">copper rod</text><line x1=\"60\" y1=\"24\" x2=\"112\" y2=\"24\" stroke=\"#444441\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"/><text x=\"86\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">30 strokes ... then test with pins</text></svg>"}, {"id": "P3·8-6", "lv": 2, "q": "Name 3 ways a magnet can lose its magnetism.", "qz": "说出磁铁失去磁性的 3 种情况。", "a": "Heating, hammering and dropping.", "az": "加热、敲打、摔落。", "s": "A magnet can lose its magnetism when it is heated, hammered or dropped.", "f": "磁铁怕烫、怕打、怕摔,请温柔一点。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"28.666666666666668\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🔥</text><text x=\"28.666666666666668\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\"></text><text x=\"86.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🔨</text><text x=\"86.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\"></text><text x=\"143.33333333333334\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">👇</text><text x=\"143.33333333333334\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\"></text><text x=\"86.0\" y=\"57\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\">Three clues.</text></svg>"}, {"id": "P3·8-7", "lv": 1, "q": "Name one thing that uses a magnet.", "qz": "说出一样用到磁铁的东西。", "a": "A fridge door, a doorstop or a crane.", "az": "冰箱门、门吸、起重机。", "s": "The magnetic strip keeps the refrigerator door closed.", "f": "冰箱门能自己关紧,靠的是门边的磁条。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"28.666666666666668\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🧭</text><text x=\"28.666666666666668\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\"></text><text x=\"86.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🚪</text><text x=\"86.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\"></text><text x=\"143.33333333333334\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🏗️</text><text x=\"143.33333333333334\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\"></text><text x=\"86.0\" y=\"57\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\">Three clues.</text></svg>"}, {"id": "P3·8-8", "lv": 3, "q": "You test if more batteries make an electromagnet stronger. What must be kept the same?", "qz": "测试“电池越多电磁铁越强”,什么要保持不变?", "a": "Type of batteries, nail and clips. Number of turns.", "az": "电池种类、钉子种类、回形针种类、线圈数。", "s": "Only one variable is changed. The other variables are kept the same.", "f": "kept the same = 不变的。电池数量是“改变”的,别选它。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"8\" y=\"8\" width=\"48\" height=\"34\" rx=\"1.5\" fill=\"#FBE3DA\" stroke=\"#D85A30\" stroke-width=\"1.2\"/><text x=\"32\" y=\"20\" text-anchor=\"middle\" font-size=\"6\" font-weight=\"700\" fill=\"#D85A30\">CHANGE</text><text x=\"32\" y=\"32\" text-anchor=\"middle\" font-size=\"6\" font-weight=\"700\" fill=\"#444441\">batteries</text><rect x=\"62\" y=\"8\" width=\"48\" height=\"34\" rx=\"1.5\" fill=\"#DCEBFA\" stroke=\"#378ADD\" stroke-width=\"1.2\"/><text x=\"86\" y=\"20\" text-anchor=\"middle\" font-size=\"6\" font-weight=\"700\" fill=\"#378ADD\">MEASURE</text><text x=\"86\" y=\"32\" text-anchor=\"middle\" font-size=\"6\" font-weight=\"700\" fill=\"#444441\">clips lifted</text><rect x=\"116\" y=\"8\" width=\"48\" height=\"34\" rx=\"1.5\" fill=\"#DDF2E8\" stroke=\"#1D9E75\" stroke-width=\"1.2\"/><text x=\"140\" y=\"20\" text-anchor=\"middle\" font-size=\"6\" font-weight=\"700\" fill=\"#1D9E75\">KEEP SAME</text><text x=\"140\" y=\"33\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#444441\">? ? ?</text><text x=\"86\" y=\"54\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\">a fair test changes only ONE thing</text></svg>"}, {"id": "P3·8-9", "lv": 1, "q": "What do we call a magnet made using electricity?", "qz": "用电做出来的磁铁叫什么?", "a": "An electromagnet.", "az": "电磁铁。", "s": "A magnet made by the electrical method is called an electromagnet.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"62\" y=\"26\" width=\"46\" height=\"7\" rx=\"1.5\" fill=\"#888780\" stroke=\"#444441\" stroke-width=\"0.8\"/><path d=\"M67.0 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><path d=\"M73.0 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><path d=\"M79.0 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><path d=\"M85.0 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><path d=\"M91.0 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><path d=\"M97.0 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><rect x=\"66\" y=\"8\" width=\"12\" height=\"7\" rx=\"1.5\" fill=\"#fff\" stroke=\"#444441\" stroke-width=\"0.9\"/><rect x=\"80\" y=\"8\" width=\"12\" height=\"7\" rx=\"1.5\" fill=\"#fff\" stroke=\"#444441\" stroke-width=\"0.9\"/><path d=\"M66 12 H60 V30 H62 M92 12 H112 V30 H108\" fill=\"none\" stroke=\"#444441\" stroke-width=\"0.9\"/><text x=\"85\" y=\"44\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">wire + iron nail + batteries</text></svg>"}, {"id": "P3·8-10", "lv": 2, "q": "How do you make an electromagnet?", "qz": "怎样做电磁铁?", "a": "Coil wire round an iron nail. Connect a battery.", "az": "电线绕铁钉,接上电池。", "s": "Coil a wire around an iron nail and connect the ends to a battery.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"28.666666666666668\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🧵</text><text x=\"28.666666666666668\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">wire</text><text x=\"86.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🔩</text><text x=\"86.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">iron nail</text><text x=\"143.33333333333334\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🔋</text><text x=\"143.33333333333334\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">battery</text></svg>"}, {"id": "P3·8-11", "lv": 2, "q": "Give one safety rule for an electromagnet.", "qz": "说一条电磁铁的安全规则。", "a": "Do not connect it for too long.", "az": "不要接太久。", "s": "Do not connect the electromagnet to the battery for too long as it may become hot.", "f": "还有:不要碰裸露的电线,不要接家里的插座。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🔋</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">battery</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">⏰</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">too long?</text></svg>"}, {"id": "P3·8-12", "lv": 2, "q": "You use 1, 2, then 3 batteries and count the clips. What is measured?", "qz": "用 1、2、3 个电池,数吸住的回形针。测量的变量是什么?", "a": "The number of steel clips attracted.", "az": "吸住的回形针数量。", "s": "The variable measured is the number of steel clips attracted.", "f": "数的是什么,measured 就是什么。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🔋</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">1, 2, 3</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">📎</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">count</text></svg>"}, {"id": "P3·8-13", "lv": 2, "q": "Why do scientists repeat an experiment?", "qz": "科学家为什么要重复做实验?", "a": "To get reliable results.", "az": "让结果可靠。", "s": "The experiment is repeated to ensure that the results are reliable.", "f": "背这个词:reliable。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🔁</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">again</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🔁</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">and again</text></svg>"}, {"id": "P3·8-14", "lv": 3, "q": "The type of nail AND the number of turns are both different. Is it a fair test?", "qz": "钉子种类和线圈数都不一样。这是公平测试吗?", "a": "No. Two variables were changed.", "az": "不是。改了两个变量。", "s": "It is not a fair test because more than one variable was changed.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"20\" y=\"26\" width=\"46\" height=\"7\" rx=\"1.5\" fill=\"#888780\" stroke=\"#444441\" stroke-width=\"0.8\"/><path d=\"M25.0 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><path d=\"M29.5 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><path d=\"M34.0 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><path d=\"M38.5 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><path d=\"M43.0 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><path d=\"M47.5 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><path d=\"M52.0 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><path d=\"M56.5 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><rect x=\"24\" y=\"8\" width=\"12\" height=\"7\" rx=\"1.5\" fill=\"#fff\" stroke=\"#444441\" stroke-width=\"0.9\"/><path d=\"M24 12 H18 V30 H20 M36 12 H70 V30 H66\" fill=\"none\" stroke=\"#444441\" stroke-width=\"0.9\"/><text x=\"43\" y=\"44\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">iron nail, 25 turns</text><rect x=\"104\" y=\"26\" width=\"46\" height=\"7\" rx=\"1.5\" fill=\"#888780\" stroke=\"#444441\" stroke-width=\"0.8\"/><path d=\"M109.0 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><path d=\"M121.0 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><path d=\"M133.0 25 v9\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"1.6\"/><rect x=\"108\" y=\"8\" width=\"12\" height=\"7\" rx=\"1.5\" fill=\"#fff\" stroke=\"#444441\" stroke-width=\"0.9\"/><path d=\"M108 12 H102 V30 H104 M120 12 H154 V30 H150\" fill=\"none\" stroke=\"#444441\" stroke-width=\"0.9\"/><text x=\"127\" y=\"44\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">steel nail, 8 turns</text></svg>"}, {"id": "P3·8-15", "lv": 2, "q": "How does a maglev train float above the track?", "qz": "磁浮列车怎样浮在轨道上?", "a": "The magnets repel each other.", "az": "磁铁互相排斥。", "s": "The magnets on the train and the tracks repel each other.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"86\" y=\"38\" text-anchor=\"middle\" font-size=\"28\" font-family=\"Noto Color Emoji\">🚄</text><text x=\"86\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">maglev train</text></svg>"}, {"id": "P3·8-16", "lv": 2, "q": "How does a scrapyard crane pick out iron and steel?", "qz": "废料场的起重机怎样挑出铁和钢?", "a": "With a strong electromagnet.", "az": "用很强的电磁铁。", "s": "The electromagnet attracts objects made of iron and steel.", "f": "关掉电,东西就放下来。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"28.666666666666668\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🏗️</text><text x=\"28.666666666666668\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">crane</text><text x=\"86.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🔩</text><text x=\"86.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">iron</text><text x=\"143.33333333333334\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🥫</text><text x=\"143.33333333333334\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">aluminium</text></svg>"}]}, {"code": "P4·1", "en": "PLANT SYSTEM", "zh": "植物系统", "color": "#3B8A3E", "cards": [{"id": "P4·1-1", "lv": 1, "q": "What do roots do?", "qz": "根有什么功能?", "a": "Absorb water and mineral salts. Hold the plant firmly.", "az": "吸收水和矿物盐,固定植物。", "s": "The roots absorb water and mineral salts and hold the plant firmly to the ground.", "f": "根是吸管,也是锚。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"40\" y=\"40\" width=\"70\" height=\"16\" rx=\"1.5\" fill=\"#D9B98A\" stroke=\"none\" stroke-width=\"0\"/><line x1=\"75\" y1=\"40\" x2=\"75\" y2=\"10\" stroke=\"#5BA84A\" stroke-width=\"2.5\"/><ellipse cx=\"62\" cy=\"20\" rx=\"12\" ry=\"5\" fill=\"#5BA84A\"/><ellipse cx=\"88\" cy=\"14\" rx=\"12\" ry=\"5\" fill=\"#5BA84A\"/><ellipse cx=\"63\" cy=\"31\" rx=\"10\" ry=\"4\" fill=\"#5BA84A\"/><path d=\"M75 40 q-10 6 -16 12 M75 40 q2 8 0 14 M75 40 q10 5 16 12\" fill=\"none\" stroke=\"#F4EBD8\" stroke-width=\"1.8\"/><text x=\"120\" y=\"14\" text-anchor=\"start\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">leaf</text><line x1=\"100\" y1=\"14\" x2=\"118\" y2=\"13\" stroke=\"#888780\" stroke-width=\"0.8\"/><text x=\"120\" y=\"30\" text-anchor=\"start\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">stem</text><line x1=\"77\" y1=\"28\" x2=\"118\" y2=\"29\" stroke=\"#888780\" stroke-width=\"0.8\"/><text x=\"120\" y=\"50\" text-anchor=\"start\" font-size=\"7\" font-weight=\"700\" fill=\"#D85A30\">roots</text><line x1=\"92\" y1=\"50\" x2=\"118\" y2=\"49\" stroke=\"#888780\" stroke-width=\"0.8\"/></svg>"}, {"id": "P4·1-2", "lv": 1, "q": "What does the stem do?", "qz": "茎有什么功能?", "a": "Holds the plant upright. Transports water and food.", "az": "让植物直立,运输水和食物。", "s": "The stem keeps the plant upright and transports water, mineral salts and food.", "f": "茎是柱子,也是电梯。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"40\" y=\"40\" width=\"70\" height=\"16\" rx=\"1.5\" fill=\"#D9B98A\" stroke=\"none\" stroke-width=\"0\"/><line x1=\"75\" y1=\"40\" x2=\"75\" y2=\"10\" stroke=\"#5BA84A\" stroke-width=\"2.5\"/><ellipse cx=\"62\" cy=\"20\" rx=\"12\" ry=\"5\" fill=\"#5BA84A\"/><ellipse cx=\"88\" cy=\"14\" rx=\"12\" ry=\"5\" fill=\"#5BA84A\"/><ellipse cx=\"63\" cy=\"31\" rx=\"10\" ry=\"4\" fill=\"#5BA84A\"/><path d=\"M75 40 q-10 6 -16 12 M75 40 q2 8 0 14 M75 40 q10 5 16 12\" fill=\"none\" stroke=\"#F4EBD8\" stroke-width=\"1.8\"/><text x=\"120\" y=\"14\" text-anchor=\"start\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">leaf</text><line x1=\"100\" y1=\"14\" x2=\"118\" y2=\"13\" stroke=\"#888780\" stroke-width=\"0.8\"/><text x=\"120\" y=\"30\" text-anchor=\"start\" font-size=\"7\" font-weight=\"700\" fill=\"#D85A30\">stem</text><line x1=\"77\" y1=\"28\" x2=\"118\" y2=\"29\" stroke=\"#888780\" stroke-width=\"0.8\"/><text x=\"120\" y=\"50\" text-anchor=\"start\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">roots</text><line x1=\"92\" y1=\"50\" x2=\"118\" y2=\"49\" stroke=\"#888780\" stroke-width=\"0.8\"/></svg>"}, {"id": "P4·1-3", "lv": 1, "q": "What do leaves do?", "qz": "叶子有什么功能?", "a": "They make food for the plant.", "az": "为植物制造食物。", "s": "The leaves absorb light to make food for the plant.", "f": "叶子是厨房。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"40\" y=\"40\" width=\"70\" height=\"16\" rx=\"1.5\" fill=\"#D9B98A\" stroke=\"none\" stroke-width=\"0\"/><line x1=\"75\" y1=\"40\" x2=\"75\" y2=\"10\" stroke=\"#5BA84A\" stroke-width=\"2.5\"/><ellipse cx=\"62\" cy=\"20\" rx=\"12\" ry=\"5\" fill=\"#5BA84A\"/><ellipse cx=\"88\" cy=\"14\" rx=\"12\" ry=\"5\" fill=\"#5BA84A\"/><ellipse cx=\"63\" cy=\"31\" rx=\"10\" ry=\"4\" fill=\"#5BA84A\"/><path d=\"M75 40 q-10 6 -16 12 M75 40 q2 8 0 14 M75 40 q10 5 16 12\" fill=\"none\" stroke=\"#F4EBD8\" stroke-width=\"1.8\"/><text x=\"120\" y=\"14\" text-anchor=\"start\" font-size=\"7\" font-weight=\"700\" fill=\"#D85A30\">leaf</text><line x1=\"100\" y1=\"14\" x2=\"118\" y2=\"13\" stroke=\"#888780\" stroke-width=\"0.8\"/><text x=\"120\" y=\"30\" text-anchor=\"start\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">stem</text><line x1=\"77\" y1=\"28\" x2=\"118\" y2=\"29\" stroke=\"#888780\" stroke-width=\"0.8\"/><text x=\"120\" y=\"50\" text-anchor=\"start\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">roots</text><line x1=\"92\" y1=\"50\" x2=\"118\" y2=\"49\" stroke=\"#888780\" stroke-width=\"0.8\"/></svg>"}, {"id": "P4·1-4", "lv": 2, "q": "Do roots absorb food from the soil?", "qz": "根从泥土里吸收食物吗?", "a": "No. Only water and mineral salts.", "az": "不是。只吸收水和矿物盐。", "s": "Roots absorb water and mineral salts. The leaves make food.", "f": "写 \"roots absorb food\" 会被扣分。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs 8 -4 2 -10\" fill=\"none\" stroke=\"#5BA84A\" stroke-width=\"2.2\"/><text x=\"130\" y=\"22\" text-anchor=\"middle\" font-size=\"18\" font-family=\"Noto Color Emoji\">☀️</text><text x=\"48\" y=\"30\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">weak stem</text><text x=\"130\" y=\"44\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\">stick for support</text></svg>"}, {"id": "P4·1-6", "lv": 2, "q": "A plant in a dark box dies. What is it missing?", "qz": "黑箱里的植物死了。它缺什么?", "a": "Light. It cannot make food.", "az": "光。它不能制造食物。", "s": "Without light, the plant cannot make food, so it dies.", "f": "黑箱里有空气。缺的是光,不是空气。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"54\" y=\"6\" width=\"64\" height=\"42\" rx=\"1.5\" fill=\"#3A3A38\" stroke=\"#444441\" stroke-width=\"1.2\"/><text x=\"86\" y=\"42\" text-anchor=\"middle\" font-size=\"22\" font-family=\"Noto Color Emoji\">🌱</text><text x=\"140\" y=\"30\" text-anchor=\"middle\" font-size=\"16\" font-family=\"Noto Color Emoji\">☀️</text><text x=\"86\" y=\"56\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">plant kept in a dark box</text></svg>"}, {"id": "P4·1-7", "lv": 2, "q": "A plant with fewer leaves grows more slowly. Why?", "qz": "叶子少的植物长得慢。为什么?", "a": "Fewer leaves make less food.", "az": "叶子少,制造的食物就少。", "s": "With fewer leaves, the plant makes less food, so it grows more slowly.", "f": "厨房小,饭就少。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"54\" y=\"40\" text-anchor=\"middle\" font-size=\"28\" font-family=\"Noto Color Emoji\">🌿</text><text x=\"54\" y=\"54\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">many leaves</text><line x1=\"118\" y1=\"46\" x2=\"118\" y2=\"14\" stroke=\"#5BA84A\" stroke-width=\"2.5\"/><ellipse cx=\"126\" cy=\"18\" rx=\"8\" ry=\"3.5\" fill=\"#5BA84A\"/><text x=\"118\" y=\"54\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">1 leaf left</text></svg>"}, {"id": "P4·1-8", "lv": 2, "q": "In a plant experiment, why is oil added on the water?", "qz": "植物实验里,为什么在水面加一层油?", "a": "To stop the water from evaporating.", "az": "防止水蒸发。", "s": "The layer of oil prevents the water from evaporating.", "f": "这样水变少,只能是被植物喝掉的。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"66.6\" y=\"26\" width=\"38.8\" height=\"24\" fill=\"#CFE6F8\"/><path d=\"M66 14 V50 H106 V14\" fill=\"none\" stroke=\"#444441\" stroke-width=\"1.3\"/><rect x=\"66.6\" y=\"23\" width=\"38.8\" height=\"3\" rx=\"0\" fill=\"#F5C542\" stroke=\"none\" stroke-width=\"0\"/><line x1=\"86\" y1=\"40\" x2=\"86\" y2=\"4\" stroke=\"#5BA84A\" stroke-width=\"2\"/><ellipse cx=\"94\" cy=\"8\" rx=\"8\" ry=\"3.5\" fill=\"#5BA84A\"/><text x=\"126\" y=\"26\" text-anchor=\"start\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">oil layer</text><line x1=\"106\" y1=\"25\" x2=\"124\" y2=\"25\" stroke=\"#888780\" stroke-width=\"0.8\"/><text x=\"126\" y=\"42\" text-anchor=\"start\" font-size=\"6.5\" font-weight=\"700\" fill=\"#378ADD\">water</text><line x1=\"100\" y1=\"40\" x2=\"124\" y2=\"41\" stroke=\"#888780\" stroke-width=\"0.8\"/></svg>"}, {"id": "P4·1-9", "lv": 1, "q": "Name the four main parts of a leaf.", "qz": "说出叶子的四个主要部分。", "a": "Leaf blade, leaf stalk, main vein, smaller veins.", "az": "叶片、叶柄、主脉、侧脉。", "s": "The main parts of a leaf are the leaf blade, leaf stalk, main vein and smaller veins.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><ellipse cx=\"80\" cy=\"26\" rx=\"34\" ry=\"15\" fill=\"#5BA84A\" stroke=\"none\"/><line x1=\"46\" y1=\"26\" x2=\"114\" y2=\"26\" stroke=\"#D8F0C8\" stroke-width=\"1.6\"/><line x1=\"60\" y1=\"26\" x2=\"66\" y2=\"16\" stroke=\"#D8F0C8\" stroke-width=\"0.9\"/><line x1=\"60\" y1=\"26\" x2=\"66\" y2=\"36\" stroke=\"#D8F0C8\" stroke-width=\"0.9\"/><line x1=\"72\" y1=\"26\" x2=\"78\" y2=\"16\" stroke=\"#D8F0C8\" stroke-width=\"0.9\"/><line x1=\"72\" y1=\"26\" x2=\"78\" y2=\"36\" stroke=\"#D8F0C8\" stroke-width=\"0.9\"/><line x1=\"84\" y1=\"26\" x2=\"90\" y2=\"16\" stroke=\"#D8F0C8\" stroke-width=\"0.9\"/><line x1=\"84\" y1=\"26\" x2=\"90\" y2=\"36\" stroke=\"#D8F0C8\" stroke-width=\"0.9\"/><line x1=\"96\" y1=\"26\" x2=\"102\" y2=\"16\" stroke=\"#D8F0C8\" stroke-width=\"0.9\"/><line x1=\"96\" y1=\"26\" x2=\"102\" y2=\"36\" stroke=\"#D8F0C8\" stroke-width=\"0.9\"/><line x1=\"114\" y1=\"26\" x2=\"138\" y2=\"26\" stroke=\"#8A5A2B\" stroke-width=\"2.2\"/><text x=\"86\" y=\"54\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">a leaf has 4 main parts</text></svg>"}, {"id": "P4·1-10", "lv": 2, "q": "What are the tiny openings on a leaf for?", "qz": "叶子上的小孔有什么用?", "a": "For the exchange of gases.", "az": "让气体进出。", "s": "Gases move into and out of the leaf through the tiny openings.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🍃</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">leaf</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">💨</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">gases</text></svg>"}, {"id": "P4·1-11", "lv": 1, "q": "A tree stem and a herb stem: what is different?", "qz": "树的茎和香草的茎,有什么不同?", "a": "Woody and non-woody.", "az": "木质和非木质。", "s": "A tree has a woody stem but this herb has a non-woody stem.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌳</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">tree</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌿</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">herb</text></svg>"}, {"id": "P4·1-12", "lv": 2, "q": "A carrot is which part of the plant? What does it do?", "qz": "胡萝卜是植物的哪个部分?它做什么?", "a": "The root. It stores food.", "az": "根。它储存食物。", "s": "A carrot is a storage root. It stores food made by the leaves.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🥕</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">carrot</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🍠</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">sweet potato</text></svg>"}, {"id": "P4·1-13", "lv": 2, "q": "Why are cactus leaves shaped like spines?", "qz": "仙人掌的叶子为什么像刺?", "a": "To reduce water loss.", "az": "减少水分流失。", "s": "The spine-like leaves of the cactus reduce water loss.", "f": "顺便让想吃它的动物后悔。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"86\" y=\"38\" text-anchor=\"middle\" font-size=\"28\" font-family=\"Noto Color Emoji\">🌵</text><text x=\"86\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">cactus</text></svg>"}, {"id": "P4·1-14", "lv": 2, "q": "Which part of a cactus makes food?", "qz": "仙人掌哪个部分制造食物?", "a": "The green stem.", "az": "绿色的茎。", "s": "The green stem of the cactus makes food.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌵</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">cactus</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">☀️</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">light</text></svg>"}, {"id": "P4·1-15", "lv": 2, "q": "A plant's roots are cut off. What will happen?", "qz": "植物的根被切掉了。会怎样?", "a": "It cannot absorb water. It will die.", "az": "吸不到水,会死。", "s": "Without roots, the plant cannot absorb water and mineral salts.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"40\" y=\"40\" width=\"70\" height=\"16\" rx=\"1.5\" fill=\"#D9B98A\" stroke=\"none\" stroke-width=\"0\"/><line x1=\"75\" y1=\"40\" x2=\"75\" y2=\"10\" stroke=\"#5BA84A\" stroke-width=\"2.5\"/><ellipse cx=\"62\" cy=\"20\" rx=\"12\" ry=\"5\" fill=\"#5BA84A\"/><ellipse cx=\"88\" cy=\"14\" rx=\"12\" ry=\"5\" fill=\"#5BA84A\"/><ellipse cx=\"63\" cy=\"31\" rx=\"10\" ry=\"4\" fill=\"#5BA84A\"/><path d=\"M75 40 q-10 6 -16 12 M75 40 q2 8 0 14 M75 40 q10 5 16 12\" fill=\"none\" stroke=\"#F4EBD8\" stroke-width=\"1.8\"/><text x=\"120\" y=\"14\" text-anchor=\"start\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">leaf</text><line x1=\"100\" y1=\"14\" x2=\"118\" y2=\"13\" stroke=\"#888780\" stroke-width=\"0.8\"/><text x=\"120\" y=\"30\" text-anchor=\"start\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">stem</text><line x1=\"77\" y1=\"28\" x2=\"118\" y2=\"29\" stroke=\"#888780\" stroke-width=\"0.8\"/><text x=\"120\" y=\"50\" text-anchor=\"start\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">roots</text><line x1=\"92\" y1=\"50\" x2=\"118\" y2=\"49\" stroke=\"#888780\" stroke-width=\"0.8\"/></svg>"}, {"id": "P4·1-16", "lv": 3, "q": "Plant B has most of its leaves removed. After 2 weeks it is shorter than plant A. Why?", "qz": "植物 B 被摘掉大部分叶子,两周后比 A 矮。为什么?", "a": "It made less food.", "az": "它制造的食物比较少。", "s": "Plant B has fewer leaves to make food, so it grows less.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"54\" y=\"40\" text-anchor=\"middle\" font-size=\"28\" font-family=\"Noto Color Emoji\">🌿</text><text x=\"54\" y=\"54\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">many leaves</text><line x1=\"118\" y1=\"46\" x2=\"118\" y2=\"14\" stroke=\"#5BA84A\" stroke-width=\"2.5\"/><ellipse cx=\"126\" cy=\"18\" rx=\"8\" ry=\"3.5\" fill=\"#5BA84A\"/><text x=\"118\" y=\"54\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">1 leaf left</text></svg>"}]}, {"code": "P4·2", "en": "HUMAN SYSTEMS", "zh": "人体系统", "color": "#D1603D", "cards": [{"id": "P4·2-1", "lv": 1, "q": "Where does food go after the mouth? Say the 5 parts in order.", "qz": "食物从口进去后经过哪里?按顺序说出 5 个部位。", "a": "Mouth, gullet, stomach, small intestine, large intestine.", "az": "口、食道、胃、小肠、大肠。", "s": "Food moves from the mouth to the gullet, stomach, small intestine and large intestine.", "f": "先小肠,后大肠。小的排前面。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"4\" y=\"16\" width=\"28\" height=\"24\" rx=\"1.5\" fill=\"#F7F7F2\" stroke=\"#444441\" stroke-width=\"1\"/><text x=\"18\" y=\"30\" text-anchor=\"middle\" font-size=\"5.2\" font-weight=\"700\" fill=\"#444441\">stomach</text><rect x=\"38\" y=\"16\" width=\"28\" height=\"24\" rx=\"1.5\" fill=\"#F7F7F2\" stroke=\"#444441\" stroke-width=\"1\"/><text x=\"52\" y=\"30\" text-anchor=\"middle\" font-size=\"5.2\" font-weight=\"700\" fill=\"#444441\">mouth</text><rect x=\"72\" y=\"16\" width=\"28\" height=\"24\" rx=\"1.5\" fill=\"#F7F7F2\" stroke=\"#4444
