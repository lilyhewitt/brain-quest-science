<head>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#F4F2EC;font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#2C2C2A;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:fixed;inset:0;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:grid;grid-template-columns:76px minmax(0,1fr) 76px;grid-template-rows:40px minmax(0,1fr);gap:8px 10px}
#top{grid-column:1/4;display:flex;align-items:center;gap:10px}
#unitBtn{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #D9D6CC;border-radius:999px;padding:5px 14px 5px 6px;font-size:16px;font-weight:700}
#unitBtn .dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px}
#unitBtn .chev{font-size:12px;color:#888}
#cloudBtn{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #D9D6CC;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;color:#5F5E5A}#cloudBtn.on{color:#0F6E56;border-color:#9FD3C1}
#prog{margin-left:auto;font-size:15px;color:#5F5E5A;font-weight:600}
#prog b{color:#0F6E56}
.rail{display:flex;flex-direction:column;gap:8px}
.big{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:18px;background:#fff;border:1.5px solid #D9D6CC;font-size:16px;font-weight:700;transition:transform .08s}
.big:active{transform:scale(.95)}
.big svg{width:30px;height:30px}
#nextBtn{background:#4A3A8C;border-color:#4A3A8C;color:#fff}
#knowBtn{background:#0F6E56;border-color:#0F6E56;color:#fff}
#againBtn{background:#FFF4E0;border-color:#E9B95E;color:#7A4E00}
#stage{position:relative;overflow:hidden;container-type:size;display:flex;align-items:center;justify-content:center;perspective:1600px;min-width:0;min-height:0}
#flip{--u:calc(min(100cqw - 4px,(100cqh - 24px)*1.5161)/94);width:calc(var(--u)*94);height:calc(var(--u)*62);margin-bottom:18px;position:relative;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1)}
#flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.b{transform:rotateY(180deg)}
.scaler{position:absolute;left:0;top:0;width:calc(94*var(--u));height:calc(62*var(--u))}
.x .card{border:0;border-radius:calc(4*var(--u));background:#fff;box-shadow:0 var(--u) calc(3*var(--u)) rgba(0,0,0,.12)}
.x .hole,.x .gap{display:none}
.x .band.fr{padding-left:calc(3.5*var(--u))}.x .band.ab{padding-right:calc(3.5*var(--u))}
.x .q{font-size:calc(4.41*var(--u))}.x .qz{font-size:calc(3.35*var(--u))}.x .a{font-size:calc(4.94*var(--u))}.x .az{font-size:calc(3.7*var(--u))}.x .say{font-size:calc(3.7*var(--u))}.x .fun{font-size:calc(3.18*var(--u))}
#tapHint{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:12px;color:#9a988f;pointer-events:none}
#sheet{position:fixed;inset:0;background:rgba(30,28,40,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
#sheet.on{display:flex}
#panel{background:#F4F2EC;border-radius:22px 22px 0 0;width:100%;max-width:900px;padding:14px max(16px,env(safe-area-inset-left)) max(14px,env(safe-area-inset-bottom));max-height:96%;overflow:auto}
#panel h3{margin:2px 0 10px;font-size:17px;display:flex;align-items:center}
#panel h3 button{margin-left:auto;font-size:15px;color:#5F5E5A;padding:4px 8px}
.lv{font-size:13px;color:#5F5E5A;font-weight:700;margin:6px 2px}
.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.tile{border-radius:14px;color:#fff;padding:8px 8px 7px;text-align:left;min-height:74px;display:flex;flex-direction:column;gap:2px;position:relative}
.tile .c{font-size:11px;opacity:.9;font-weight:700}
.tile .n{font-size:14px;font-weight:700;line-height:1.2}
.tile .p{margin-top:auto;font-size:11px;opacity:.95}
.tile .s{position:absolute;top:6px;right:8px;font-size:15px;color:#FAD47A}
.tile.cur{outline:3px solid #2C2C2A;outline-offset:2px}
#done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
#done.on{display:flex}
#done .t{font-size:24px;font-weight:800}
#done .row{display:flex;gap:10px}
#done button{background:#fff;border:1.5px solid #D9D6CC;border-radius:14px;padding:10px 18px;font-size:16px;font-weight:700}
#done button.p{background:#4A3A8C;border-color:#4A3A8C;color:#fff}
#rot{position:fixed;inset:0;background:#4A3A8C;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:20;font-size:20px;font-weight:700;text-align:center;padding:20px}
#rot img{width:96px;height:96px;border-radius:22px}
@media (orientation:portrait){#rot{display:flex}}
.sheet2{position:fixed;inset:0;background:rgba(30,28,40,.45);display:none;align-items:center;justify-content:center;z-index:11;padding:12px}
.sheet2.on{display:flex}
.panel2{background:#F4F2EC;border-radius:20px;width:100%;max-width:520px;padding:14px 16px 16px;max-height:100%;overflow:auto}
.panel2 h3{margin:2px 0 10px;font-size:17px;display:flex;align-items:center}.panel2 h3 button{margin-left:auto;font-size:15px;color:#5F5E5A;padding:4px 8px}
#syncBox{background:#fff;border:1.5px solid #D9D6CC;border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.5}
#syncBox b.t{font-size:15px}#syncBox .m{color:#5F5E5A;font-size:13px}#syncBox .r{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
#syncBox input{flex:1 1 9em;min-width:0;height:40px;border-radius:10px;border:1.5px solid #D9D6CC;padding:0 10px;font:inherit;font-size:16px;letter-spacing:.08em;text-transform:uppercase}
#syncBox button{height:40px;border-radius:10px;padding:0 14px;font-weight:700;background:#4A3A8C;color:#fff}#syncBox button.g{background:#fff;color:#5F5E5A;border:1.5px solid #D9D6CC}
#syncBox .ok{color:#0F6E56}


*{box-sizing:border-box}
.x{margin:0;font-family:"Noto Sans CJK SC","Noto Sans",sans-serif;color:#2C2C2A}
.card{width:calc(94*var(--u));height:calc(62*var(--u));border:calc(0.3*var(--u)) dashed #999;position:relative;overflow:hidden}
.card.bk{display:flex;flex-direction:column}
.band{color:#fff;font-size:calc(2.822*var(--u));font-weight:700;padding:calc(1.3*var(--u)) calc(3.5*var(--u));letter-spacing:calc(0.071*var(--u));white-space:nowrap;flex:none}
.band.ab{background:#0F6E56;padding-right:calc(11*var(--u))}
.band.fr{padding-left:calc(11*var(--u))}
.hole{position:absolute;top:calc(5*var(--u));left:calc(5*var(--u));width:calc(5*var(--u));height:calc(5*var(--u));border-radius:50%;background:#fff;border:calc(0.3*var(--u)) dashed #888;z-index:2}
.hole.r{left:auto;right:calc(5*var(--u))}
.gap{float:left;width:calc(8*var(--u));height:calc(4.5*var(--u))}.gap.r{float:right}
.code{background:rgba(255,255,255,.25);border-radius:calc(1*var(--u));padding:0 calc(1.2*var(--u));margin-right:calc(1*var(--u))}
.qn{float:right;margin-left:calc(2.5*var(--u))}.st{float:right;color:#FAD47A;letter-spacing:calc(0.176*var(--u))}
.q{font-size:calc(4.057*var(--u));font-weight:700;line-height:1.22;padding:calc(1.6*var(--u)) calc(3.5*var(--u)) 0}
.qz{font-size:calc(3.175*var(--u));color:#5F5E5A;line-height:1.25;padding:calc(0.6*var(--u)) calc(3.5*var(--u)) 0}
.img{position:absolute;left:calc(4*var(--u));right:calc(4*var(--u));bottom:calc(1.5*var(--u));height:calc(30*var(--u))}
.a{font-size:calc(4.763*var(--u));font-weight:700;line-height:1.2;padding:calc(2.6*var(--u)) calc(4*var(--u)) 0;color:#0F6E56}
.az{font-size:calc(3.528*var(--u));line-height:1.3;padding:calc(1*var(--u)) calc(4*var(--u)) 0}
.sp{flex:1}
.say{margin:0 calc(3*var(--u)) calc(1.6*var(--u));border:calc(0.35*var(--u)) solid #0F6E56;border-radius:calc(1.5*var(--u));background:#F1F8F5;padding:calc(1.2*var(--u)) calc(2.2*var(--u)) calc(1.4*var(--u));font-size:calc(3.528*var(--u));font-weight:700;line-height:1.25}
.say .lab{display:block;font-size:calc(2.469*var(--u));font-weight:700;color:#0F6E56;letter-spacing:calc(0.106*var(--u))}
.fun{margin:0 calc(4*var(--u)) calc(2*var(--u));font-size:calc(2.999*var(--u));line-height:1.3;color:#5F5E5A;border-left:calc(1*var(--u)) solid;padding-left:calc(2*var(--u))}

</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button id="unitBtn" aria-label="选择主题"><span class="dot" id="uDot"></span><span id="uName"></span><span class="chev">▼</span></button>
    <button id="cloudBtn" aria-label="家庭存档"></button><div id="prog"></div>
  </div>
  <div class="rail"><button class="big" id="flipBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-4M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.9 4M20 20v-4h-4"/></svg>翻面</button></div>
  <div id="stage">
    <div id="flip"><div class="face f"></div><div class="face b"></div></div>
    <div id="tapHint">点卡片翻面 · 左滑下一张</div>
    <div id="done"><div class="t">★ 这个单元全部会了! ★</div><div>太厉害了,换一个单元挑战吧。</div><div class="row"><button id="resetBtn">重新来一遍</button><button class="p" id="pickBtn">选别的单元</button></div></div>
  </div>
  <div class="rail" id="rightRail">
    <button class="big" id="nextBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>下一张</button>
    <button class="big" id="knowBtn" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>会了</button>
    <button class="big" id="againBtn" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/></svg>再看看</button>
  </div>
</div>
<div id="sheet"><div id="panel"><h3>选一个主题<button id="closeSheet">关闭 ✕</button></h3><div class="lv">P3 三年级</div><div class="grid" id="g3"></div><div class="lv">P4 四年级</div><div class="grid" id="g4"></div></div></div>
<div id="saveSheet" class="sheet2"><div class="panel2"><h3>家庭存档<span style="font-size:12px;color:#9a988f;font-weight:400;margin-left:8px">版本 v6</span><button id="closeSave">关闭 ✕</button></h3><div id="syncBox"></div></div></div>
<div id="rot"><img src="icon-192.png" alt=""><div>头脑测试科学篇</div><div style="font-size:16px;font-weight:500">请把手机横过来 ↻</div></div>
<script>
const U=[{"code": "P3·1", "en": "LIVING THINGS", "zh": "生物与非生物", "color": "#6A4FB3", "cards": [{"id": "P3·1-1", "lv": 1, "q": "A robot can walk and talk. Is it a living thing?", "qz": "机器人会走路会说话,它是生物吗?", "a": "No! It cannot grow or reproduce.", "az": "不是!它不会长大,也不会生宝宝。", "s": "A robot is a non-living thing. It cannot grow or reproduce.", "f": "会动 ≠ 活的。不然电风扇也要吃早餐了。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"28.666666666666668\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🤖</text><text x=\"28.666666666666668\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">robot</text><text x=\"86.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🧸</text><text x=\"86.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">toy</text><text x=\"143.33333333333334\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🚗</text><text x=\"143.33333333333334\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">car</text><text x=\"86.0\" y=\"57\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\">They can move. Can they grow?</text></svg>"}, {"id": "P3·1-2", "lv": 1, "q": "What 3 things do all living things need?", "qz": "所有生物都需要哪三样东西?", "a": "Air, food and water.", "az": "空气、食物和水。", "s": "Living things need water, food and air to survive.", "f": "少一样都不行,连小强(蟑螂)也一样。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"28.666666666666668\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">💨</text><text x=\"28.666666666666668\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">air</text><text x=\"86.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🍎</text><text x=\"86.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">food</text><text x=\"143.33333333333334\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">💧</text><text x=\"143.33333333333334\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">water</text></svg>"}, {"id": "P3·1-3", "lv": 1, "q": "What 3 things can all living things do?", "qz": "所有生物都能做哪三件事?", "a": "Grow, respond to changes, reproduce.", "az": "长大、对变化有反应、繁殖后代。", "s": "Living things grow, respond to changes and reproduce.", "f": "口诀:长、应、生。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"28.666666666666668\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌱</text><text x=\"28.666666666666668\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">grow</text><text x=\"86.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🙈</text><text x=\"86.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">respond</text><text x=\"143.33333333333334\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🐣</text><text x=\"143.33333333333334\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">reproduce</text></svg>"}, {"id": "P3·1-4", "lv": 2, "q": "You tap the tank. The fish swims away. What does this show?", "qz": "你敲鱼缸,鱼游走了。这说明生物的什么特征?", "a": "It responds to changes.", "az": "它会对变化作出反应。", "s": "The fish is a living thing. It responds to changes.", "f": "答案里一定要有 respond 这个词,写 \"it is scared\" 没有分。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"50\" y=\"8\" width=\"80\" height=\"36\" rx=\"1.5\" fill=\"#CFE6F8\" stroke=\"#444441\" stroke-width=\"1.2\"/><text x=\"100\" y=\"34\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Noto Color Emoji\">🐟</text><text x=\"32\" y=\"36\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Noto Color Emoji\">👉</text><text x=\"32\" y=\"50\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">tap!</text><line x1=\"84\" y1=\"26\" x2=\"70\" y2=\"26\" stroke=\"#D85A30\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"/><text x=\"90\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">fish swims away</text></svg>"}, {"id": "P3·1-5", "lv": 2, "q": "A seed does not move. Is it a living thing?", "qz": "种子一动也不动,它是生物吗?", "a": "Yes! It can grow into a plant.", "az": "是!它能长成一棵植物。", "s": "A seed is a living thing. It can grow into a young plant.", "f": "它只是在睡觉,不是在装死。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><ellipse cx=\"28.666666666666668\" cy=\"24\" rx=\"6\" ry=\"4.5\" fill=\"#8A5A2B\"/><text x=\"28.666666666666668\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">seed</text><line x1=\"47.013333333333335\" y1=\"23\" x2=\"67.65333333333334\" y2=\"23\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"/><text x=\"86.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌱</text><text x=\"86.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">young plant</text><line x1=\"104.34666666666666\" y1=\"23\" x2=\"124.98666666666668\" y2=\"23\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"/><text x=\"143.33333333333334\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌳</text><text x=\"143.33333333333334\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">adult plant</text></svg>"}, {"id": "P3·1-6", "lv": 2, "q": "Why do we poke holes in the lid of a bug jar?", "qz": "养虫子的罐子,盖子上为什么要戳洞?", "a": "To let air in. Living things need air.", "az": "让空气进去。生物需要空气。", "s": "Living things need air to survive.", "f": "没洞的罐子 = 虫子的噩梦。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"62\" y=\"12\" width=\"48\" height=\"40\" rx=\"1.5\" fill=\"#F7F7F2\" stroke=\"#444441\" stroke-width=\"1.2\"/><rect x=\"58\" y=\"7\" width=\"56\" height=\"6\" rx=\"1.5\" fill=\"#888780\" stroke=\"#444441\" stroke-width=\"1.2\"/><circle cx=\"66\" cy=\"10\" r=\"1.2\" fill=\"#fff\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"74\" cy=\"10\" r=\"1.2\" fill=\"#fff\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"82\" cy=\"10\" r=\"1.2\" fill=\"#fff\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"90\" cy=\"10\" r=\"1.2\" fill=\"#fff\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"98\" cy=\"10\" r=\"1.2\" fill=\"#fff\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"106\" cy=\"10\" r=\"1.2\" fill=\"#fff\" stroke=\"none\" stroke-width=\"1\"/><text x=\"86\" y=\"44\" text-anchor=\"middle\" font-size=\"18\" font-family=\"Noto Color Emoji\">🐞</text><text x=\"130\" y=\"10\" text-anchor=\"start\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">holes</text><line x1=\"112\" y1=\"10\" x2=\"128\" y2=\"9\" stroke=\"#888780\" stroke-width=\"0.8\"/></svg>"}, {"id": "P3·1-7", "lv": 2, "q": "Do plants need to eat lunch?", "qz": "植物要吃午饭吗?", "a": "No. They make their own food.", "az": "不用。它们自己制造食物。", "s": "Plants make their own food when there is light.", "f": "植物自带厨房,阳光就是煤气。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"28.666666666666668\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">☀️</text><text x=\"28.666666666666668\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">light</text><text x=\"86.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌿</text><text x=\"86.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">plant</text><text x=\"143.33333333333334\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🍱</text><text x=\"143.33333333333334\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">lunch?</text></svg>"}, {"id": "P3·1-8", "lv": 3, "q": "Mould grows on old bread. Is mould a living thing?", "qz": "旧面包上长了霉。霉是生物吗?", "a": "Yes. It grows and reproduces.", "az": "是。它会长大,也会繁殖。", "s": "Mould is a living thing. It can grow and reproduce.", "f": "它不但是活的,还在偷吃你的面包。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"76\" y=\"38\" text-anchor=\"middle\" font-size=\"28\" font-family=\"Noto Color Emoji\">🍞</text><circle cx=\"70\" cy=\"24\" r=\"3\" fill=\"#4E8B57\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"80\" cy=\"30\" r=\"4\" fill=\"#4E8B57\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"74\" cy=\"34\" r=\"2.5\" fill=\"#3B6E45\" stroke=\"none\" stroke-width=\"1\"/><text x=\"128\" y=\"24\" text-anchor=\"start\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">mould</text><line x1=\"84\" y1=\"28\" x2=\"126\" y2=\"23\" stroke=\"#888780\" stroke-width=\"0.8\"/></svg>"}, {"id": "P3·1-9", "lv": 1, "q": "What do we call grouping things by their similarities?", "qz": "把相似的东西分成一组,叫什么?", "a": "Classification.", "az": "分类。", "s": "Classification is grouping things based on their similarities.", "f": "整理书包也是分类:书一堆,零食一堆。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🐱</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">living</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🧸</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">non-living</text></svg>"}, {"id": "P3·1-10", "lv": 2, "q": "A plant grows towards the window. What does this show?", "qz": "植物朝窗户的方向长。这说明什么?", "a": "It responds to light.", "az": "它对光有反应。", "s": "The plant responds to changes by growing towards the light.", "f": "植物不会走路,但会“歪头”。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🪟</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">window</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌱</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">plant</text></svg>"}, {"id": "P3·1-11", "lv": 1, "q": "Why do we need water? Give one reason.", "qz": "我们为什么需要水?说一个原因。", "a": "To remove waste from our body.", "az": "把废物排出身体。", "s": "We need water to remove waste and carry out our daily activities.", "f": "人不喝水,大约只能撑三天。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">💧</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">water</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🏃</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">activities</text></svg>"}, {"id": "P3·1-12", "lv": 2, "q": "A mimosa folds its leaves when touched. Which characteristic is this?", "qz": "含羞草一碰就合上叶子。这是生物的哪个特征?", "a": "It responds to changes.", "az": "对变化有反应。", "s": "The mimosa responds to changes to protect itself from harm.", "f": "它的外号叫 touch-me-not:别碰我!", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">👉</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">touch</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌿</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">mimosa</text></svg>"}, {"id": "P3·1-13", "lv": 1, "q": "Why must living things reproduce?", "qz": "生物为什么要繁殖?", "a": "So that their kind does not die out.", "az": "这样同类才不会灭绝。", "s": "The ability to reproduce ensures the survival of living things.", "f": "extinct = 一个都不剩,像恐龙。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🦖</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">extinct</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🐣</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">young</text></svg>"}, {"id": "P3·1-14", "lv": 2, "q": "Name two ways animals reproduce.", "qz": "说出动物繁殖的两种方式。", "a": "Giving birth or laying eggs.", "az": "胎生,或者产卵。", "s": "Some animals give birth to their young alive. Others lay eggs.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🐱</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">cat</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🐔</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">hen</text></svg>"}, {"id": "P3·1-15", "lv": 2, "q": "Name two ways plants reproduce.", "qz": "说出植物繁殖的两种方式。", "a": "By seeds or by spores.", "az": "靠种子,或者靠孢子。", "s": "Some plants reproduce by seeds. Others reproduce by spores.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🍎</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">apple tree</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌿</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">fern</text></svg>"}, {"id": "P3·1-16", "lv": 3, "q": "X grows, reproduces and needs air. Y only moves. Which is a living thing?", "qz": "X 会长大、会繁殖、需要空气。Y 只会动。哪个是生物?", "a": "X.", "az": "X。", "s": "X is a living thing because it can grow and reproduce.", "f": "看全部特征,别只看“会动”。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">❓</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">X: grows, reproduces</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">❓</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">Y: only moves</text></svg>"}]}, {"code": "P3·2", "en": "ANIMALS & PLANTS", "zh": "动植物分类", "color": "#2E7D6B", "cards": [{"id": "P3·2-1", "lv": 1, "q": "A bat can fly. Is it a bird?", "qz": "蝙蝠会飞,它是鸟吗?", "a": "No. It is a mammal.", "az": "不是,它是哺乳动物。", "s": "A bat is a mammal. It has hair and gives birth to its young alive.", "f": "会飞不等于鸟。飞机也会飞。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"86\" y=\"38\" text-anchor=\"middle\" font-size=\"30\" font-family=\"Noto Color Emoji\">🦇</text><text x=\"86\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">bat</text></svg>"}, {"id": "P3·2-2", "lv": 1, "q": "A penguin cannot fly. Is it a bird?", "qz": "企鹅不会飞,它是鸟吗?", "a": "Yes. It has feathers.", "az": "是。它有羽毛。", "s": "A penguin is a bird. It has feathers as its outer covering.", "f": "有羽毛就是鸟,不会飞也没关系。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"86\" y=\"38\" text-anchor=\"middle\" font-size=\"30\" font-family=\"Noto Color Emoji\">🐧</text><text x=\"86\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">penguin</text></svg>"}, {"id": "P3·2-3", "lv": 1, "q": "How many legs does an insect have?", "qz": "昆虫有几条腿?", "a": "6 legs.", "az": "6 条腿。", "s": "An insect has six legs, a pair of feelers and three body parts.", "f": "身体三部分:头 head、胸 thorax、腹 abdomen。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"86\" y=\"40\" text-anchor=\"middle\" font-size=\"34\" font-family=\"Noto Color Emoji\">🐜</text><text x=\"86\" y=\"54\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">ant (an insect): count the legs</text></svg>"}, {"id": "P3·2-4", "lv": 2, "q": "Is a spider an insect?", "qz": "蜘蛛是昆虫吗?", "a": "No. A spider has 8 legs.", "az": "不是。蜘蛛有 8 条腿。", "s": "A spider is not an insect because it has eight legs, not six.", "f": "多了两条腿,就被昆虫俱乐部拒绝了。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🕷️</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">spider</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🐜</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">ant</text><text x=\"86.0\" y=\"57\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\">Count the legs.</text></svg>"}, {"id": "P3·2-5", "lv": 2, "q": "A whale lives in the sea. Is it a fish?", "qz": "鲸鱼住在海里,它是鱼吗?", "a": "No. It is a mammal.", "az": "不是,它是哺乳动物。", "s": "A whale is a mammal. It gives birth to its young alive.", "f": "名字里有“鱼”,但它是骗你的。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"86\" y=\"38\" text-anchor=\"middle\" font-size=\"30\" font-family=\"Noto Color Emoji\">🐳</text><text x=\"86\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">whale</text></svg>"}, {"id": "P3·2-6", "lv": 1, "q": "What covers a fish, a bird and a mammal?", "qz": "鱼、鸟、哺乳动物的身体表面各是什么?", "a": "Fish: scales. Bird: feathers. Mammal: hair or fur.", "az": "鱼:鳞片。鸟:羽毛。哺乳动物:毛发。", "s": "Fish have scales. Birds have feathers. Mammals have hair or fur.", "f": "看“外衣”就能分类。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"28.666666666666668\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🐟</text><text x=\"28.666666666666668\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">fish: ?</text><text x=\"86.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🐦</text><text x=\"86.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">bird: ?</text><text x=\"143.33333333333334\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🐶</text><text x=\"143.33333333333334\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">mammal: ?</text></svg>"}, {"id": "P3·2-7", "lv": 2, "q": "Frog skin and snake skin: what is different?", "qz": "青蛙和蛇的皮肤有什么不同?", "a": "A frog has moist skin but a snake has dry scaly skin.", "az": "青蛙皮肤湿润,而蛇是干燥有鳞的皮肤。", "s": "A frog has moist skin but a snake has dry and scaly skin.", "f": "写“不同点”要两边都写:A 怎样 but B 怎样。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🐸</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">frog (amphibian)</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🐍</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">snake (reptile)</text></svg>"}, {"id": "P3·2-8", "lv": 2, "q": "A tree has fruits but no flowers today. Is it a flowering plant?", "qz": "一棵树有果实,今天没看到花。它是开花植物吗?", "a": "Yes. Fruits come from flowers.", "az": "是。果实是花变成的。", "s": "It is a flowering plant. The flowers develop into fruits.", "f": "有果就一定开过花,花只是下班了。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"60\" y=\"38\" text-anchor=\"middle\" font-size=\"28\" font-family=\"Noto Color Emoji\">🌳</text><text x=\"100\" y=\"38\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Noto Color Emoji\">🥭</text><text x=\"100\" y=\"50\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">fruit</text><text x=\"60\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">no flowers today</text><line x1=\"74\" y1=\"28\" x2=\"90\" y2=\"28\" stroke=\"#888780\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"/></svg>"}, {"id": "P3·2-9", "lv": 1, "q": "What are the four main groups of living things?", "qz": "生物分成哪四大类?", "a": "Plants, animals, fungi and bacteria.", "az": "植物、动物、真菌、细菌。", "s": "Living things can be classified into plants, animals, fungi and bacteria.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"21.5\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌿</text><text x=\"21.5\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">?</text><text x=\"64.5\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🐶</text><text x=\"64.5\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">?</text><text x=\"107.5\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🍄</text><text x=\"107.5\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">?</text><text x=\"150.5\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🦠</text><text x=\"150.5\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">?</text></svg>"}, {"id": "P3·2-10", "lv": 1, "q": "How does a fish breathe?", "qz": "鱼怎样呼吸?", "a": "Through its gills.", "az": "用鳃。", "s": "Fish breathe through their gills and have fins to swim.", "f": "gills 鳃,fins 鳍,scales 鳞:鱼的三件套。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"86\" y=\"38\" text-anchor=\"middle\" font-size=\"28\" font-family=\"Noto Color Emoji\">🐟</text><text x=\"86\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">fish</text></svg>"}, {"id": "P3·2-11", "lv": 2, "q": "Name two ways a frog can breathe.", "qz": "青蛙可以用哪两种方式呼吸?", "a": "Through its skin and its lungs.", "az": "用皮肤,也用肺。", "s": "Amphibians can breathe through their moist skin and their lungs.", "f": "青蛙:我用皮肤也能呼吸,厉害吧。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"86\" y=\"38\" text-anchor=\"middle\" font-size=\"28\" font-family=\"Noto Color Emoji\">🐸</text><text x=\"86\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">frog</text></svg>"}, {"id": "P3·2-12", "lv": 2, "q": "Is a starfish a fish?", "qz": "海星是鱼吗?", "a": "No.", "az": "不是。", "s": "A sea star is not a fish. It does not have scales or gills.", "f": "又一个名字骗人的,和鲸“鱼”是同伙。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">⭐</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">sea star</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🐟</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">fish</text></svg>"}, {"id": "P3·2-13", "lv": 2, "q": "What can a mammal mother make for her young?", "qz": "哺乳动物妈妈能为宝宝产生什么?", "a": "Milk.", "az": "奶。", "s": "Female mammals produce milk for their young.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🐄</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">mother</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🍼</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">?</text></svg>"}, {"id": "P3·2-14", "lv": 2, "q": "How do non-flowering plants reproduce?", "qz": "不开花植物怎样繁殖?", "a": "From spores.", "az": "靠孢子。", "s": "Non-flowering plants do not bear flowers. They reproduce from spores.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"86\" y=\"38\" text-anchor=\"middle\" font-size=\"28\" font-family=\"Noto Color Emoji\">🌿</text><text x=\"86\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">fern: no flowers</text></svg>"}, {"id": "P3·2-15", "lv": 2, "q": "Reptiles are cold-blooded. What does that mean?", "qz": "爬行动物是冷血动物。这是什么意思?", "a": "Their body temperature changes.", "az": "体温会跟着环境变。", "s": "The body temperature of a reptile changes with its environment.", "f": "不是说它们性格冷酷。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🦎</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">lizard</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌡️</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">?</text></svg>"}, {"id": "P3·2-16", "lv": 3, "q": "P has spores and cannot make food. Q has feathers and lays eggs. What are they?", "qz": "P 有孢子、不能制造食物。Q 有羽毛、会产卵。它们是什么?", "a": "P: fungus. Q: bird.", "az": "P 是真菌,Q 是鸟。", "s": "P is a fungus because it has spores and cannot make its own food.", "f": "一条一条对特征,别猜。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">❓</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">P: spores</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">❓</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">Q: feathers</text></svg>"}]}, {"code": "P3·3", "en": "FUNGI & BACTERIA", "zh": "真菌和细菌", "color": "#B5651D", "cards": [{"id": "P3·3-1", "lv": 1, "q": "Is a mushroom a plant?", "qz": "蘑菇是植物吗?", "a": "No. It is a fungus.", "az": "不是,它是真菌。", "s": "Fungi cannot make their own food.", "f": "它没有厨房,只能吃别人的。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🍄</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">mushroom</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🌿</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">plant</text><text x=\"86.0\" y=\"57\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\">Which one makes its own food?</text></svg>"}, {"id": "P3·3-2", "lv": 1, "q": "How do fungi reproduce?", "qz": "真菌怎样繁殖?", "a": "By spores.", "az": "靠孢子。", "s": "Fungi reproduce by spores.", "f": "孢子很小很轻,风一吹就搬家。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"60\" y=\"42\" text-anchor=\"middle\" font-size=\"28\" font-family=\"Noto Color Emoji\">🍄</text><circle cx=\"84\" cy=\"30\" r=\"1.3\" fill=\"#8A5A2B\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"93\" cy=\"23\" r=\"1.3\" fill=\"#8A5A2B\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"102\" cy=\"16\" r=\"1.3\" fill=\"#8A5A2B\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"111\" cy=\"30\" r=\"1.3\" fill=\"#8A5A2B\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"120\" cy=\"23\" r=\"1.3\" fill=\"#8A5A2B\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"129\" cy=\"16\" r=\"1.3\" fill=\"#8A5A2B\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"138\" cy=\"30\" r=\"1.3\" fill=\"#8A5A2B\" stroke=\"none\" stroke-width=\"1\"/><text x=\"118\" y=\"48\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">spores</text><line x1=\"76\" y1=\"30\" x2=\"150\" y2=\"20\" stroke=\"#888780\" stroke-width=\"1.2\" marker-end=\"url(#ah)\"/></svg>"}, {"id": "P3·3-3", "lv": 2, "q": "What 2 things help mould grow fast?", "qz": "哪两样东西让霉长得快?", "a": "Moisture and warmth.", "az": "水分和温暖。", "s": "Mould grows well when there is moisture and warmth.", "f": "霉不需要阳光。它喜欢又湿又暖的地方,像桑拿房。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"21.5\" y=\"32\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Noto Color Emoji\">💧</text><text x=\"21.5\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">water?</text><text x=\"64.5\" y=\"32\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Noto Color Emoji\">🌡️</text><text x=\"64.5\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">warmth?</text><text x=\"107.5\" y=\"32\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Noto Color Emoji\">☀️</text><text x=\"107.5\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">light?</text><text x=\"150.5\" y=\"32\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Noto Color Emoji\">❄️</text><text x=\"150.5\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">cold?</text></svg>"}, {"id": "P3·3-4", "lv": 2, "q": "Fresh bread or toast: which gets mouldy first?", "qz": "新鲜面包和烤面包,哪个先发霉?", "a": "Fresh bread. It has more water.", "az": "新鲜面包。它水分比较多。", "s": "The fresh bread has more water, so mould grows faster on it.", "f": "烤过的面包太干了,霉不想住。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><path d=\"M40 14 q0 -8 12 -8 q12 0 12 8 v22 h-24 z\" fill=\"#F1DDB5\" stroke=\"#8A5A2B\" stroke-width=\"1.3\"/><text x=\"52\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">fresh bread</text><text x=\"52\" y=\"54\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\"></text><path d=\"M108 14 q0 -8 12 -8 q12 0 12 8 v22 h-24 z\" fill=\"#B77B3F\" stroke=\"#8A5A2B\" stroke-width=\"1.3\"/><text x=\"120\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">toast</text><text x=\"120\" y=\"54\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\"></text></svg>"}, {"id": "P3·3-5", "lv": 1, "q": "Can you see bacteria with your eyes?", "qz": "用眼睛能看到细菌吗?", "a": "No. You need a microscope.", "az": "不能,要用显微镜。", "s": "Bacteria are tiny living things. We need a microscope to see them.", "f": "你手上现在就有几百万个。去洗手!", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🔬</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">microscope</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🦠</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">bacteria: tiny!</text></svg>"}, {"id": "P3·3-6", "lv": 2, "q": "Are all bacteria bad for us?", "qz": "所有细菌都是坏的吗?", "a": "No. Some bacteria are useful.", "az": "不是。有些细菌是有用的。", "s": "Some bacteria are harmful, while others are useful to us.", "f": "酸奶里就住着有用的细菌。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🥛</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">yoghurt</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🦠</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">bacteria</text></svg>"}, {"id": "P3·3-7", "lv": 2, "q": "Name a useful fungus. What does it do?", "qz": "说出一种有用的真菌。它能做什么?", "a": "Yeast. It makes bread rise.", "az": "酵母。它让面包发起来。", "s": "Yeast is a useful fungus. It is used to make the dough rise.", "f": "没有酵母,面包就是一块砖。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"28.666666666666668\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🍞</text><text x=\"28.666666666666668\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">bread</text><text x=\"86.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🍄</text><text x=\"86.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">mushroom</text><text x=\"143.33333333333334\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🧀</text><text x=\"143.33333333333334\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">cheese</text><text x=\"86.0\" y=\"57\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\">Fungi can be useful.</text></svg>"}, {"id": "P3·3-8", "lv": 3, "q": "Bread K is wet and warm. Bread N is dry and cold. Which has the LEAST mould?", "qz": "面包 K 又湿又暖,面包 N 又干又冷。哪个霉最少?", "a": "Bread N.", "az": "面包 N。", "s": "Bread N has the least water and the lowest temperature, so it has the least mould.", "f": "先圈 least:要的是最少,不是最多!", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><path d=\"M40 14 q0 -8 12 -8 q12 0 12 8 v22 h-24 z\" fill=\"#F1DDB5\" stroke=\"#8A5A2B\" stroke-width=\"1.3\"/><text x=\"52\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">K: wet + warm</text><text x=\"52\" y=\"54\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\">5 ml, 30°C</text><path d=\"M108 14 q0 -8 12 -8 q12 0 12 8 v22 h-24 z\" fill=\"#F1DDB5\" stroke=\"#8A5A2B\" stroke-width=\"1.3\"/><text x=\"120\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">N: dry + cold</text><text x=\"120\" y=\"54\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\">1 ml, 2°C</text></svg>"}, {"id": "P3·3-9", "lv": 1, "q": "Name three examples of fungi.", "qz": "说出三种真菌。", "a": "Mushrooms, yeast and mould.", "az": "蘑菇、酵母、霉菌。", "s": "Mushrooms, yeast and mould are fungi.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🍄</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">clue 1</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🍞</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">clue 2 and 3</text></svg>"}, {"id": "P3·3-10", "lv": 2, "q": "How does a fungus get its food?", "qz": "真菌怎样得到食物?", "a": "It breaks down what it grows on.", "az": "把它长在上面的东西分解掉。", "s": "Fungi break down the object into simpler substances and absorb them as food.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"76\" y=\"38\" text-anchor=\"middle\" font-size=\"28\" font-family=\"Noto Color Emoji\">🍞</text><circle cx=\"70\" cy=\"24\" r=\"3\" fill=\"#4E8B57\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"80\" cy=\"30\" r=\"4\" fill=\"#4E8B57\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"74\" cy=\"34\" r=\"2.5\" fill=\"#3B6E45\" stroke=\"none\" stroke-width=\"1\"/><text x=\"128\" y=\"24\" text-anchor=\"start\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">mould</text><line x1=\"84\" y1=\"28\" x2=\"126\" y2=\"23\" stroke=\"#888780\" stroke-width=\"0.8\"/></svg>"}, {"id": "P3·3-11", "lv": 2, "q": "Where are the spores of a mushroom found?", "qz": "蘑菇的孢子在哪里?", "a": "In the gills under the cap.", "az": "在菌盖下面的菌褶里。", "s": "The spores of a mushroom are found in the gills under the cap.", "f": "风一吹,孢子就出门旅行。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"86\" y=\"38\" text-anchor=\"middle\" font-size=\"28\" font-family=\"Noto Color Emoji\">🍄</text><text x=\"86\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">mushroom</text></svg>"}, {"id": "P3·3-12", "lv": 1, "q": "Why must we wash our hands before eating?", "qz": "吃东西前为什么要洗手?", "a": "To remove harmful bacteria.", "az": "洗掉有害的细菌。", "s": "Harmful bacteria on our hands can enter our body and make us sick.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🧼</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">soap</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">👐</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">hands</text></svg>"}, {"id": "P3·3-13", "lv": 1, "q": "Name the three shapes of bacteria.", "qz": "说出细菌的三种形状。", "a": "Rod, sphere and spiral.", "az": "杆状、球状、螺旋状。", "s": "Bacteria can be rod-shaped, sphere-shaped or spiral-shaped.", "f": "像薯条、丸子和弹簧。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"30\" y=\"22\" width=\"30\" height=\"10\" rx=\"5\" fill=\"#7FB77E\" stroke=\"#444441\" stroke-width=\"1\"/><circle cx=\"86\" cy=\"27\" r=\"8\" fill=\"#7FB77E\" stroke=\"#444441\" stroke-width=\"1\"/><path d=\"M112 27 q5 -10 10 0 q5 10 10 0 q5 -10 10 0\" fill=\"none\" stroke=\"#4E8B57\" stroke-width=\"3\"/><text x=\"86\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">three shapes of bacteria</text></svg>"}, {"id": "P3·3-14", "lv": 2, "q": "Why should we not eat mouldy bread?", "qz": "为什么不能吃发霉的面包?", "a": "It can make us fall sick.", "az": "会生病。", "s": "Bread mould is a harmful fungus. Eating mouldy bread can make us sick.", "f": "把霉抠掉也不行,整片都不要吃。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"76\" y=\"38\" text-anchor=\"middle\" font-size=\"28\" font-family=\"Noto Color Emoji\">🍞</text><circle cx=\"70\" cy=\"24\" r=\"3\" fill=\"#4E8B57\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"80\" cy=\"30\" r=\"4\" fill=\"#4E8B57\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"74\" cy=\"34\" r=\"2.5\" fill=\"#3B6E45\" stroke=\"none\" stroke-width=\"1\"/><text x=\"128\" y=\"24\" text-anchor=\"start\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">mould</text><line x1=\"84\" y1=\"28\" x2=\"126\" y2=\"23\" stroke=\"#888780\" stroke-width=\"0.8\"/></svg>"}, {"id": "P3·3-15", "lv": 2, "q": "How do useful bacteria in our body help us?", "qz": "身体里有用的细菌怎样帮我们?", "a": "They help us break down food.", "az": "帮我们分解食物。", "s": "Useful bacteria in our body help us to break down food.", "f": "", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"43.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🥛</text><text x=\"43.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">yoghurt</text><text x=\"129.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🦠</text><text x=\"129.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">bacteria</text></svg>"}, {"id": "P3·3-16", "lv": 3, "q": "Mould test: toasted bread vs untoasted bread. Which variable is changed?", "qz": "霉菌实验:烤过和没烤过的面包。改变的变量是什么?", "a": "Whether the bread is toasted.", "az": "面包有没有烤过。", "s": "The variable changed is whether the bread is toasted.", "f": "其他都要一样:同样的袋子,同一个地方,同样十天。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><path d=\"M40 14 q0 -8 12 -8 q12 0 12 8 v22 h-24 z\" fill=\"#F1DDB5\" stroke=\"#8A5A2B\" stroke-width=\"1.3\"/><text x=\"52\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">fresh bread</text><text x=\"52\" y=\"54\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\"></text><path d=\"M108 14 q0 -8 12 -8 q12 0 12 8 v22 h-24 z\" fill=\"#B77B3F\" stroke=\"#8A5A2B\" stroke-width=\"1.3\"/><text x=\"120\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">toast</text><text x=\"120\" y=\"54\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\"></text></svg>"}]}, {"code": "P3·4", "en": "MATERIALS", "zh": "材料", "color": "#2F6DB5", "cards": [{"id": "P3·4-1", "lv": 1, "q": "Why is a fish tank made of glass?", "qz": "鱼缸为什么用玻璃做?", "a": "Glass is transparent and waterproof.", "az": "玻璃透明,又防水。", "s": "Glass is transparent, so we can see the fish clearly.", "f": "透明:看得见鱼。防水:地板不会湿。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"52\" y=\"10\" width=\"68\" height=\"34\" rx=\"1.5\" fill=\"#CFE6F8\" stroke=\"#444441\" stroke-width=\"1.2\"/><text x=\"76\" y=\"36\" text-anchor=\"middle\" font-size=\"18\" font-family=\"Noto Color Emoji\">🐠</text><text x=\"100\" y=\"30\" text-anchor=\"middle\" font-size=\"14\" font-family=\"Noto Color Emoji\">🐟</text><text x=\"86\" y=\"54\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">glass tank</text></svg>"}, {"id": "P3·4-2", "lv": 1, "q": "Why is a raincoat made of plastic?", "qz": "雨衣为什么用塑料做?", "a": "Plastic is waterproof. It does not absorb water.", "az": "塑料防水,不吸水。", "s": "Plastic is waterproof, so it keeps us dry in the rain.", "f": "用毛巾做雨衣?那你就是一块会走路的海绵。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"28.666666666666668\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">☔</text><text x=\"28.666666666666668\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">umbrella</text><text x=\"86.0\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🧥</text><text x=\"86.0\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">raincoat</text><text x=\"143.33333333333334\" y=\"32\" text-anchor=\"middle\" font-size=\"24\" font-family=\"Noto Color Emoji\">🥾</text><text x=\"143.33333333333334\" y=\"46\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">boots</text></svg>"}, {"id": "P3·4-3", "lv": 2, "q": "A ruler bends but does not break. Is it strong or flexible?", "qz": "尺子弯了但没断。这是坚固还是柔韧?", "a": "Flexible.", "az": "柔韧。", "s": "It is flexible. It can bend without breaking.", "f": "能弯不断 = flexible;一弯就断 = rigid;受力不断 = strong。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><path d=\"M30 40 q56 -40 112 0\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"6\"/><text x=\"86\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">bends, does not break</text></svg>"}, {"id": "P3·4-4", "lv": 1, "q": "Which lets the most light pass through: A, B or C?", "qz": "A、B、C 哪个让最多的光通过?", "a": "A. It is transparent.", "az": "A。它是透明的。", "s": "Material A is transparent. It allows most light to pass through.", "f": "B 是半透明 translucent,C 是不透明 opaque。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><text x=\"86\" y=\"30\" text-anchor=\"middle\" font-size=\"14\" font-family=\"Noto Color Emoji\">⭐</text><rect x=\"23\" y=\"8\" width=\"26\" height=\"26\" fill=\"#fff\" fill-opacity=\"0.05\" stroke=\"#444441\"/><text x=\"36\" y=\"44\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">A</text><rect x=\"73\" y=\"8\" width=\"26\" height=\"26\" fill=\"#C9C9C9\" fill-opacity=\"0.75\" stroke=\"#444441\"/><text x=\"86\" y=\"44\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">B</text><rect x=\"123\" y=\"8\" width=\"26\" height=\"26\" fill=\"#444\" fill-opacity=\"1\" stroke=\"#444441\"/><text x=\"136\" y=\"44\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">C</text><text x=\"36\" y=\"27\" text-anchor=\"middle\" font-size=\"14\" font-family=\"Noto Color Emoji\">⭐</text><text x=\"86\" y=\"55\" text-anchor=\"middle\" font-size=\"5.5\" font-weight=\"400\" fill=\"#888780\">How well can you see the star behind?</text></svg>"}, {"id": "P3·4-5", "lv": 2, "q": "Why is a towel made of cotton?", "qz": "毛巾为什么用棉布做?", "a": "Cotton absorbs water.", "az": "棉布吸水。", "s": "Cotton absorbs water, so the towel can dry our body.", "f": "塑料毛巾只会把水推来推去。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><rect x=\"50\" y=\"10\" width=\"50\" height=\"30\" rx=\"1.5\" fill=\"#F4B6B0\" stroke=\"#D85A30\" stroke-width=\"1.2\"/><line x1=\"50\" y1=\"18\" x2=\"100\" y2=\"18\" stroke=\"#fff\" stroke-width=\"2\"/><line x1=\"50\" y1=\"32\" x2=\"100\" y2=\"32\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"122\" y=\"34\" text-anchor=\"middle\" font-size=\"18\" font-family=\"Noto Color Emoji\">💧</text><text x=\"75\" y=\"52\" text-anchor=\"middle\" font-size=\"6.5\" font-weight=\"700\" fill=\"#444441\">cotton towel</text></svg>"}, {"id": "P3·4-6", "lv": 2, "q": "A holds 5 weights. B breaks at 2 weights. Which is stronger?", "qz": "A 能挂 5 个砝码,B 挂 2 个就断。哪个更坚固?", "a": "A. It holds more weights before it breaks.", "az": "A。它断之前能挂更多砝码。", "s": "A is stronger. It can hold more weights before it breaks.", "f": "答案要写出数据:5 比 2 多。", "pic": "<svg viewBox=\"0 0 172 60\" width=\"100%\" height=\"100%\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9z\" fill=\"context-stroke\"/></marker></defs><line x1=\"20\" y1=\"8\" x2=\"152\" y2=\"8\" stroke=\"#444441\" stroke-width=\"2\"/><rect x=\"53\" y=\"8\" width=\"6\" height=\"16\" rx=\"0\" fill=\"#E8C48A\" stroke=\"#8A5A2B\" stroke-width=\"0.8\"/><rect x=\"51\" y=\"24\" width=\"10\" height=\"4.5\" rx=\"0.5\" fill=\"#888780\" stroke=\"#444441\" stroke-width=\"0.5\"/><rect x=\"51\" y=\"29\" width=\"10\" height=\"4.5\" rx=\"0.5\" fill=\"#888780\" stroke=\"#444441\" stroke-width=\"0.
